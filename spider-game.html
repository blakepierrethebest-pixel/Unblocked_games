<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider City Swing</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; font-family: Arial, sans-serif; background: linear-gradient(180deg, #091521, #112a3c 40%, #0b1a2a);
        color: white;
      }
      body { display: grid; place-items: center; }
      .game-shell {
        width: min(92vw, 1100px); height: min(76vh, 720px); background: rgba(10, 18, 25, 0.95);
        border: 2px solid rgba(76,201,240,0.5); border-radius: 18px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <canvas id="gameCanvas" width="1100" height="700"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const keys = { left: false, right: false, jump: false, swing: false };

      const player = {
        x: 100, y: 160, w: 24, h: 42, vx: 0, vy: 0, grounded: false,
        tether: null, score: 0, health: 100
      };

      const anchors = [
        { x: 140, y: 120 }, { x: 310, y: 100 }, { x: 520, y: 90 }, { x: 760, y: 140 },
        { x: 900, y: 220 }, { x: 650, y: 330 }, { x: 360, y: 330 }, { x: 180, y: 410 }, { x: 520, y: 480 }
      ];

      const enemies = [
        { x: 610, y: 210, r: 20 },
        { x: 820, y: 390, r: 22 },
        { x: 340, y: 470, r: 18 }
      ];

      const pickup = { x: 930, y: 120, r: 14, active: true };

      function nearestAnchor() {
        let best = null;
        for (const a of anchors) {
          const dx = a.x - (player.x + player.w / 2);
          const dy = a.y - (player.y + player.h / 2);
          const dist = Math.hypot(dx, dy);
          if (!best || dist < best.dist) best = { a, dist };
        }
        return best && best.dist < 190 ? best.a : null;
      }

      function update() {
        if (keys.left) player.vx -= 0.55;
        if (keys.right) player.vx += 0.55;
        if (keys.jump && player.grounded) {
          player.vy = -13;
          player.grounded = false;
        }

        if (keys.swing && player.tether) {
          const dx = player.tether.x - (player.x + player.w / 2);
          const dy = player.tether.y - (player.y + player.h / 2);
          const angle = Math.atan2(dy, dx);
          const pull = 0.18;
          player.vx += Math.cos(angle) * pull;
          player.vy += Math.sin(angle) * pull;
        }

        player.vy += 0.5;
        player.x += player.vx;
        player.y += player.vy;
        player.vx *= 0.89;

        const anchor = nearestAnchor();
        player.tether = anchor;

        if (player.y + player.h >= 620) {
          player.y = 620 - player.h;
          player.vy = 0;
          player.grounded = true;
        }

        if (player.x < 0) player.x = 0;
        if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;

        for (const enemy of enemies) {
          const dx = enemy.x - (player.x + player.w / 2);
          const dy = enemy.y - (player.y + player.h / 2);
          const dist = Math.hypot(dx, dy);
          if (dist < enemy.r + 18) {
            player.health = Math.max(0, player.health - 14);
            player.x = 100; player.y = 170; player.vx = 0; player.vy = 0;
          }
        }

        if (pickup.active) {
          const dx = pickup.x - (player.x + player.w / 2);
          const dy = pickup.y - (player.y + player.h / 2);
          if (Math.hypot(dx, dy) < 26) {
            player.score += 25;
            pickup.active = false;
            setTimeout(() => {
              pickup.x = 140 + Math.random() * 780;
              pickup.y = 100 + Math.random() * 260;
              pickup.active = true;
            }, 900);
          }
        }

        player.health = Math.min(100, player.health + 0.04);
      }

      function drawBackground() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#081923';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1c2f3c';
        for (let i = 0; i < 12; i++) {
          const x = i * 90 + 25;
          const h = 80 + (i % 4) * 38;
          ctx.fillRect(x, 620 - h, 60, h);
        }

        ctx.fillStyle = '#0b1f29';
        ctx.fillRect(0, 620, canvas.width, 80);
      }

      function drawAnchors() {
        for (const a of anchors) {
          ctx.beginPath();
          ctx.fillStyle = '#4cc9f0';
          ctx.arc(a.x, a.y, 6, 0, Math.PI * 2);
          ctx.fill();

          if (player.tether && player.tether === a) {
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(player.x + player.w / 2, player.y + player.h / 2);
            ctx.lineTo(a.x, a.y);
            ctx.stroke();
          }
        }
      }

      function drawEnemies() {
        for (const e of enemies) {
          ctx.beginPath();
          ctx.fillStyle = '#ef476f';
          ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawPickup() {
        if (!pickup.active) return;
        ctx.beginPath();
        ctx.fillStyle = '#90be6d';
        ctx.arc(pickup.x, pickup.y, pickup.r, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawPlayer() {
        ctx.fillStyle = '#dfe9ff';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = '#1d2f41';
        ctx.fillRect(player.x + 7, player.y - 12, 10, 12);
        ctx.fillRect(player.x + 17, player.y - 12, 10, 12);
      }

      function drawHUD() {
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(20, 20, 180, 16);
        ctx.fillStyle = '#90be6d';
        ctx.fillRect(20, 20, 180 * (player.health / 100), 16);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px Arial';
        ctx.fillText(`Score: ${player.score}`, 22, 58);
      }

      function frame() {
        update();
        drawBackground();
        drawAnchors();
        drawEnemies();
        drawPickup();
        drawPlayer();
        drawHUD();
        requestAnimationFrame(frame);
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'w' || e.key === 'ArrowUp' || e.key === ' ') keys.jump = true;
        if (e.key === 's' || e.key === 'ArrowDown') keys.swing = true;
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'w' || e.key === 'ArrowUp' || e.key === ' ') keys.jump = false;
        if (e.key === 's' || e.key === 'ArrowDown') keys.swing = false;
      });

      frame();
    </script>
  </body>
</html>
