<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spider City Swing</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: linear-gradient(180deg, #09141f, #172b3e 40%, #09141f); color: white; font-family: Arial, sans-serif;
      }
      body { display: flex; justify-content: center; align-items: center; }
      .game-shell {
        width: min(92vw, 1000px); height: min(76vh, 640px); background: rgba(8,15,20,0.9); border: 2px solid rgba(76,201,240,0.5); border-radius: 18px; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,0.4);
      }
      canvas {
        display: block; width: 100%; height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <canvas id="canvas" width="1000" height="600"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const keys = { left: false, right: false, jump: false, swing: false };

      const player = { x: 120, y: 180, w: 22, h: 42, vx: 0, vy: 0, grounded: false, tether: null, score: 0, health: 100 };
      const enemies = [
        { x: 660, y: 220, r: 20 },
        { x: 800, y: 340, r: 20 },
        { x: 540, y: 120, r: 18 }
      ];
      const anchors = [
        { x: 200, y: 120 }, { x: 420, y: 80 }, { x: 580, y: 130 }, { x: 820, y: 180 }, { x: 700, y: 360 }, { x: 300, y: 360 }
      ];

      function nearestAnchor() {
        let best = null;
        for (const a of anchors) {
          const dx = a.x - player.x;
          const dy = a.y - player.y;
          const dist = Math.hypot(dx, dy);
          if (!best || dist < best.dist) best = { anchor: a, dist };
        }
        return best && best.dist < 180 ? best.anchor : null;
      }

      function update() {
        if (keys.left) player.vx -= 0.5;
        if (keys.right) player.vx += 0.5;
        if (keys.jump && player.grounded) {
          player.vy = -12;
          player.grounded = false;
        }
        if (keys.swing && player.tether) {
          const dx = player.tether.x - player.x;
          const dy = player.tether.y - player.y;
          const angle = Math.atan2(dy, dx);
          const pull = 0.14;
          player.vx += Math.cos(angle) * pull;
          player.vy += Math.sin(angle) * pull;
        }

        player.vy += 0.45;
        player.x += player.vx;
        player.y += player.vy;
        player.vx *= 0.9;

        const anchor = nearestAnchor();
        if (anchor) player.tether = anchor;
        else player.tether = null;

        if (player.y + player.h >= 560) {
          player.y = 560 - player.h;
          player.vy = 0;
          player.grounded = true;
        }

        if (player.x < 0) player.x = 0;
        if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;

        for (const enemy of enemies) {
          const dx = enemy.x - player.x;
          const dy = enemy.y - player.y;
          const dist = Math.hypot(dx, dy);
          if (dist < enemy.r + 18) {
            player.health = Math.max(0, player.health - 10);
            player.x = 120; player.y = 180;
            player.vx = 0; player.vy = 0;
          }
        }

        const pickup = { x: 860, y: 140, r: 14 };
        const dx = pickup.x - player.x;
        const dy = pickup.y - player.y;
        if (Math.hypot(dx, dy) < 20) {
          player.score += 25;
          pickup.x = 100 + Math.random() * 800;
          pickup.y = 100 + Math.random() * 320;
        }

        player.health = Math.min(100, player.health + 0.04);
      }

      function draw() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = '#0b1621';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // skyline
        ctx.fillStyle = '#1b2d3d';
        for (let i = 0; i < 12; i++) {
          const x = i * 90 + 20;
          const h = 80 + (i % 4) * 40;
          ctx.fillRect(x, 500 - h, 60, h);
        }

        // anchors
        for (const a of anchors) {
          ctx.beginPath();
          ctx.fillStyle = '#4cc9f0';
          ctx.arc(a.x, a.y, 6, 0, Math.PI * 2);
          ctx.fill();
          if (player.tether && player.tether === a) {
            ctx.strokeStyle = '#ffd166';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(player.x + player.w / 2, player.y + player.h / 2);
            ctx.lineTo(a.x, a.y);
            ctx.stroke();
          }
        }

        // enemies
        for (const e of enemies) {
          ctx.beginPath();
          ctx.fillStyle = '#ef476f';
          ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // pickup 
        const pickup = { x: 860, y: 140, r: 14 }; 
        ctx.beginPath();
        ctx.fillStyle = '#90be6d';
        ctx.arc(pickup.x, pickup.y, pickup.r, 0, Math.PI * 2);
        ctx.fill();

        // player
        ctx.fillStyle = '#dfe9ff';
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = '#1b2838';
        ctx.fillRect(player.x + 6, player.y - 12, 10, 12);
        ctx.fillRect(player.x + 20, player.y - 12, 10, 12);

        // health bar
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.fillRect(18, 18, 160, 14);
        ctx.fillStyle = '#90be6d';
        ctx.fillRect(18, 18, 160 * (player.health / 100), 14);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Arial';
        ctx.fillText(`Score: ${player.score}`, 18, 58);
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'w' || e.key === 'ArrowUp' || e.key === ' ') keys.jump = true;
        if (e.key === 's' || e.key === 'ArrowDown') keys.swing = true;
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'w' || e.key === 'ArrowUp' || e.key === ' ') keys.jump = false;
        if (e.key === 's' || e.key === 'ArrowDown') keys.swing = false;
      });

      loop();
    </script>
  </body>
</html>
