<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#081823; color:white; font-family:Arial,sans-serif; }
      .panel { width: min(90vw, 420px); background: rgba(16,25,38,0.95); padding: 18px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.12); }
      .row { display:flex; gap: 8px; margin-bottom: 8px; }
      .tile { width:48px; height:48px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); display:grid; place-items:center; font-size: 1.3rem; font-weight:700; }
      .status { margin-top: 12px; color: #4cc9f0; }
    </style>
  </head>
  <body>
    <div class="panel">
      <div id="rows"></div>
      <div class="status" id="status">Guess the 5-letter word</div>
    </div>
    <script>
      const answer = 'PLANE';
      const rows = document.getElementById('rows');
      const status = document.getElementById('status');
      let guess = '';
      let row = 0;

      function renderBoard() {
        rows.innerHTML = '';
        for (let i = 0; i < 6; i++) {
          const r = document.createElement('div');
          r.className = 'row';
          for (let j = 0; j < 5; j++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.textContent = (guess[i] || '')[j] || '';
            r.appendChild(tile);
          }
          rows.appendChild(r);
        }
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && guess.length === 5) {
          if (guess === answer) { status.textContent = 'You got it!'; }
          else { status.textContent = 'Not quite — keep trying'; row++; guess=''; }
          renderBoard();
        } else if (e.key.length === 1 && /[a-z]/i.test(e.key) && guess.length < 5) {
          guess += e.key.toUpperCase();
          renderBoard();
        } else if (e.key === 'Backspace') {
          guess = guess.slice(0, -1);
          renderBoard();
        }
      });
      renderBoard();
    </script>
  </body>
</html>
