<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background: #091922; color: white; font-family: Arial, sans-serif; }
      .board { display:grid; grid-template-columns: repeat(3, 90px); gap:12px; }
      .cell { width:90px; height:90px; border-radius:14px; background:#1c3048; border:1px solid rgba(255,255,255,0.12); font-size:2.5rem; display:grid; place-items:center; cursor:pointer; }
      .status { margin-top: 18px; text-align:center; font-weight:700; }
    </style>
  </head>
  <body>
    <div>
      <div class="board" id="board"></div>
      <div class="status" id="status">Player X turn</div>
    </div>
    <script>
      const boardEl = document.getElementById('board');
      const statusEl = document.getElementById('status');
      let board = Array(9).fill('');
      let turn = 'X';

      function render() {
        boardEl.innerHTML = '';
        board.forEach((cell, index) => {
          const btn = document.createElement('button');
          btn.className = 'cell';
          btn.textContent = cell;
          btn.onclick = () => makeMove(index);
          boardEl.appendChild(btn);
        });
      }

      function makeMove(index) {
        if (board[index]) return;
        board[index] = turn;
        const winner = checkWinner();
        if (winner) {
          statusEl.textContent = `Player ${winner} wins!`;
          return;
        }
        turn = turn === 'X' ? 'O' : 'X';
        statusEl.textContent = `Player ${turn} turn`;
        render();
      }

      function checkWinner() {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for (const [a,b,c] of lines) {
          if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
        }
        return null;
      }

      render();
    </script>
  </body>
</html>
