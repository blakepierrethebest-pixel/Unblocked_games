<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Sprint</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(180deg, #081720, #1d3250 45%, #120f1b); color: white; font-family: Arial, sans-serif; }
      .panel { width: min(94vw, 1000px); height: min(78vh, 620px); background: rgba(7, 13, 19, 0.92); border: 2px solid rgba(76,201,240,0.4); border-radius: 18px; overflow: hidden; box-shadow: 0 22px 60px rgba(0,0,0,0.35); }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="panel">
      <canvas id="gameCanvas" width="1000" height="620"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const keys = { left: false, right: false, jump: false };

      const world = {
        gravity: 0.7,
        floor: 560,
        endX: 940,
        collected: 0,
        score: 0
      };

      const player = {
        x: 50,
        y: 440,
        w: 28,
        h: 42,
        vx: 0,
        vy: 0,
        onGround: false,
        color: '#dfe9ff'
      };

      const crystals = [
        { x: 180, y: 500, r: 10 },
        { x: 360, y: 440, r: 10 },
        { x: 560, y: 360, r: 10 },
        { x: 720, y: 300, r: 10 },
        { x: 890, y: 220, r: 10 }
      ];

      const enemies = [
        { x: 260, y: 530, w: 28, h: 30 },
        { x: 620, y: 530, w: 30, h: 30 },
        { x: 780, y: 520, w: 26, h: 24 }
      ];

      const platforms = [
        { x: 0, y: 560, w: 1000, h: 60 },
        { x: 160, y: 500, w: 160, h: 18 },
        { x: 350, y: 430, w: 160, h: 18 },
        { x: 540, y: 350, w: 150, h: 18 },
        { x: 700, y: 270, w: 160, h: 18 }
      ];

      function update() {
        if (keys.left) player.vx -= 0.6;
        if (keys.right) player.vx += 0.6;
        if (keys.jump && player.onGround) {
          player.vy = -14;
          player.onGround = false;
        }

        player.vy += world.gravity;
        player.x += player.vx;
        player.y += player.vy;
        player.vx *= 0.8;

        player.onGround = false;
        for (const p of platforms) {
          if (
            player.x + player.w > p.x &&
            player.x < p.x + p.w &&
            player.y + player.h >= p.y &&
            player.y + player.h <= p.y + 30 &&
            player.vy >= 0
          ) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
          }
        }

        for (const crystal of crystals) {
          const dx = player.x + player.w / 2 - crystal.x;
          const dy = player.y + player.h / 2 - crystal.y;
          if (Math.hypot(dx, dy) < 26) {
            crystal.collected = true;
            world.collected += 1;
            world.score += 20;
          }
        }

        for (const enemy of enemies) {
          const hit =
            player.x + player.w > enemy.x &&
            player.x < enemy.x + enemy.w &&
            player.y + player.h > enemy.y &&
            player.y < enemy.y + enemy.h;
          if (hit) {
            player.x = 50;
            player.y = 440;
            player.vx = 0;
            player.vy = 0;
            world.score = Math.max(0, world.score - 5);
          }
        }

        if (player.x > world.endX) {
          world.score += 100;
          player.x = 50;
          player.y = 440;
          player.vx = 0;
          player.vy = 0;
          if (world.collected >= crystals.length) {
            alert('You cleared the city sprint!');
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // sky
        ctx.fillStyle = '#071822';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // buildings
        ctx.fillStyle = '#1d2e40';
        for (let i = 0; i < 12; i++) {
          const x = i * 80 + 30;
          const h = 120 + (i % 4) * 50;
          ctx.fillRect(x, 560 - h, 50, h);
        }

        // platforms
        for (const p of platforms) {
          ctx.fillStyle = '#3a6ea5';
          ctx.fillRect(p.x, p.y, p.w, p.h);
        }

        // crystals
        for (const crystal of crystals) {
          if (crystal.collected) continue;
          ctx.fillStyle = '#77e6d5';
          ctx.beginPath();
          ctx.moveTo(crystal.x, crystal.y - crystal.r);
          ctx.lineTo(crystal.x + crystal.r, crystal.y + crystal.r);
          ctx.lineTo(crystal.x - crystal.r, crystal.y + crystal.r);
          ctx.closePath();
          ctx.fill();
        }

        // enemies
        for (const enemy of enemies) {
          ctx.fillStyle = '#ef476f';
          ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
        }

        // player
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // finish gate
        ctx.fillStyle = '#ffb703';
        ctx.fillRect(world.endX, 430, 20, 130);

        // HUD
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(16, 18, 180, 18);
        ctx.fillStyle = '#90be6d';
        ctx.fillRect(16, 18, (world.collected / crystals.length) * 180, 18);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px Arial';
        ctx.fillText(`Score: ${world.score}`, 18, 58);
        ctx.fillText(`Crystals: ${world.collected}/${crystals.length}`, 18, 82);
      }

      function frame() {
        update();
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener('keydown', (event) => {
        if (event.key === 'a' || event.key === 'ArrowLeft') keys.left = true;
        if (event.key === 'd' || event.key === 'ArrowRight') keys.right = true;
        if (event.key === 'w' || event.key === 'ArrowUp' || event.key === ' ') keys.jump = true;
      });

      window.addEventListener('keyup', (event) => {
        if (event.key === 'a' || event.key === 'ArrowLeft') keys.left = false;
        if (event.key === 'd' || event.key === 'ArrowRight') keys.right = false;
        if (event.key === 'w' || event.key === 'ArrowUp' || event.key === ' ') keys.jump = false;
      });

      frame();
    </script>
  </body>
</html>
