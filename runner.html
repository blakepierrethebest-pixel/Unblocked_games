<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runner</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#071822; color:white; font-family:Arial,sans-serif; }
      canvas { background: linear-gradient(180deg, #071822, #12314d); border: 2px solid rgba(255,255,255,0.12); }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="420"></canvas>
    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const player = { x: 80, y: 300, w: 26, h: 26, vy: 0, grounded: true };
      const obs = [{ x: 700, y: 320, w: 30, h: 30 }, { x: 940, y: 320, w: 30, h: 30 }];
      let score = 0;
      let jump = false;

      function update() {
        player.vy += 0.5; player.y += player.vy; if (player.y + player.h > 380) { player.y = 380 - player.h; player.vy = 0; player.grounded = true; }
        if (jump && player.grounded) { player.vy = -12; player.grounded = false; }
        for (const o of obs) {
          o.x -= 5;
          if (o.x + o.w < 0) { o.x = 960; score += 10; }
          if (player.x + player.w > o.x && player.x < o.x + o.w && player.y + player.h > o.y && player.y < o.y + o.h) { score = Math.max(0, score - 20); }
        }
      }
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#081822'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#2d6a4f'; ctx.fillRect(0,380,canvas.width,40);
        ctx.fillStyle = '#dfe9ff'; ctx.fillRect(player.x,player.y,player.w,player.h);
        for (const o of obs) { ctx.fillStyle = '#ef476f'; ctx.fillRect(o.x,o.y,o.w,o.h); }
        ctx.font = 'bold 22px Arial'; ctx.fillText(`Score: ${score}`, 16, 30);
      }
      function frame(){ update(); draw(); requestAnimationFrame(frame); }
      window.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'ArrowUp') jump = true; });
      window.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'ArrowUp') jump = false; });
      frame();
    </script>
  </body>
</html>
