<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <style>
      body { margin: 0; background: #08161d; color: white; display: grid; place-items: center; min-height: 100vh; font-family: Arial, sans-serif; }
      canvas { background: #102436; border: 2px solid rgba(255,255,255,0.15); }
    </style>
  </head>
  <body>
    <canvas id="game" width="560" height="560"></canvas>
    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const grid = 20;
      let snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
      let dir = { x: 1, y: 0 };
      let food = { x: 12, y: 10 };
      let score = 0;

      function update() {
        const next = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
        if (next.x < 0 || next.x >= canvas.width / grid || next.y < 0 || next.y >= canvas.height / grid) return reset();
        if (snake.some(seg => seg.x === next.x && seg.y === next.y)) return reset();
        snake.unshift(next);
        if (next.x === food.x && next.y === food.y) {
          score += 10;
          placeFood();
        } else {
          snake.pop();
        }
      }

      function placeFood() {
        food = { x: Math.floor(Math.random() * (canvas.width / grid)), y: Math.floor(Math.random() * (canvas.height / grid)) };
        if (snake.some(seg => seg.x === food.x && seg.y === food.y)) placeFood();
      }

      function reset() {
        snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
        dir = { x: 1, y: 0 }; score = 0; placeFood();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let x = 0; x < canvas.width; x += grid) {
          for (let y = 0; y < canvas.height; y += grid) {
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.strokeRect(x, y, grid, grid);
          }
        }
        ctx.fillStyle = '#90be6d';
        snake.forEach(seg => ctx.fillRect(seg.x * grid, seg.y * grid, grid - 1, grid - 1));
        ctx.fillStyle = '#ef476f';
        ctx.fillRect(food.x * grid + 2, food.y * grid + 2, grid - 4, grid - 4);
        ctx.fillStyle = '#edf6ff';
        ctx.font = 'bold 20px Arial';
        ctx.fillText(`Score: ${score}`, 14, 26);
      }

      setInterval(() => { update(); draw(); }, 120);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' && dir.y !== 1) dir = { x: 0, y: -1 };
        if (e.key === 'ArrowDown' && dir.y !== -1) dir = { x: 0, y: 1 };
        if (e.key === 'ArrowLeft' && dir.x !== 1) dir = { x: -1, y: 0 };
        if (e.key === 'ArrowRight' && dir.x !== -1) dir = { x: 1, y: 0 };
      });

      placeFood(); draw();
    </script>
  </body>
</html>
