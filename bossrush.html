<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boss Rush</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0a1320; color:white; font-family:Arial,sans-serif; }
      .panel { width: 420px; background: rgba(18, 28, 41, 0.95); border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); padding: 18px; }
      .bar { height: 18px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow:hidden; }
      .fill { height:100%; background: linear-gradient(90deg, #ffb703, #ef476f); width: 70%; }
      button { width:100%; margin-top: 14px; padding: 14px; border-radius: 12px; border:none; background: linear-gradient(135deg, #ffb703, #ff7b00); color:#0d0d0d; font-weight:800; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Boss Rush</h1>
      <div class="bar"><div class="fill" id="hp"></div></div>
      <button id="attack">Attack</button>
    </div>
    <script>
      let hp = 70;
      document.getElementById('attack').addEventListener('click', () => {
        hp = Math.max(0, hp - 12);
        document.getElementById('hp').style.width = hp + '%';
        if (hp === 0) {
          document.getElementById('attack').textContent = 'Boss Defeated';
        }
      });
    </script>
  </body>
</html>
