<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketBros Pro</title>
    <style>
      :root {
        --bg: #09111d;
        --panel: rgba(13, 22, 35, 0.92);
        --panel-alt: rgba(19, 32, 50, 0.9);
        --orange: #ffb703;
        --orange-2: #ff7b00;
        --cyan: #4cc9f0;
        --green: #90be6d;
        --red: #ef476f;
        --text: #edf6ff;
        --muted: #b7cde8;
        --line: rgba(255,255,255,0.12);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(135deg, #0c1524 0%, #132a46 50%, #0a1421 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 16px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--line);
      }

      .brand { font-size: 1.6rem; font-weight: 900; color: var(--orange); }
      .scoreboard { display: flex; gap: 24px; font-weight: 700; }
      .scoreboard b { color: var(--cyan); }

      .app {
        display: grid; grid-template-columns: 290px 1fr 300px; gap: 12px; padding: 12px; flex: 1; min-height: 0;
      }

      .panel {
        background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
        overflow: hidden; box-shadow: 0 18px 50px rgba(0,0,0,0.22);
      }

      .roster-panel { padding: 14px; }
      .section-title {
        margin: 0 0 12px; font-size: 0.76rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange);
      }

      .roster-list { display: flex; flex-direction: column; gap: 8px; max-height: 42vh; overflow: auto; }
      .player-card {
        display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center;
        background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; cursor: pointer; transition: 0.15s ease;
      }
      .player-card:hover { transform: translateY(-1px); }
      .player-card.active { background: rgba(255,183,3,0.12); border-color: rgba(255,183,3,0.7); }
      .avatar {
        width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 900; font-size: 0.72rem; color: #0d1d36; background: linear-gradient(135deg, #dfe9ff, #77d5ff);
      }
      .name-box { display: flex; flex-direction: column; gap: 2px; }
      .name-box strong { font-size: 0.8rem; }
      .name-box small { color: var(--muted); font-size: 0.72rem; }
      .rating { font-size: 0.84rem; font-weight: 800; color: var(--orange); }

      .court-panel { position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud {
        position: absolute; inset: 0; pointer-events: none;
      }
      .hud-top {
        display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 16px;
      }
      .team-score {
        background: rgba(0,0,0,0.25); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-width: 90px; text-align: center;
      }
      .team-score small { color: var(--muted); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.08em; }
      .team-score b { display: block; font-size: 2rem; margin-top: 4px; }
      .center-badges { display: flex; gap: 10px; flex-wrap: wrap; }
      .badge {
        background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; font-size: 0.7rem; color: var(--muted);
      }

      .controls-panel { padding: 16px; }
      .summary {
        background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px;
      }
      .summary h3 { margin: 0 0 10px; color: var(--orange); }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
      .stat-item {
        background: rgba(255,255,255,0.025); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; justify-content: space-between;
      }
      .buttons {
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      }
      button {
        appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.04); color: var(--text); border-radius: 12px; padding: 11px 10px; cursor: pointer; font-weight: 700;
      }
      button.primary { background: linear-gradient(135deg, var(--orange), var(--orange-2)); color: #0d0d0d; border-color: transparent; }
      button.secondary { background: rgba(76,201,240,0.08); color: var(--cyan); border-color: rgba(76,201,240,0.32); }
      .meter-wrap { margin-top: 14px; }
      .meter-label { font-size: 0.68rem; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
      .meter { height: 16px; width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
      .meter-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--green), var(--orange), var(--red)); transition: width 0.08s linear; }

      .tips {
        margin-top: 12px; background: rgba(76,201,240,0.04); border: 1px solid rgba(76,201,240,0.25); border-radius: 12px; padding: 12px;
      }
      .tips ul { margin: 8px 0 0 18px; padding: 0; color: var(--muted); line-height: 1.6; font-size: 0.78rem; }

      @media (max-width: 1100px) {
        .app { grid-template-columns: 1fr; }
        .court-panel { min-height: 480px; }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">🏀 BasketBros Pro</div>
      <div class="scoreboard">
        <div>You <b id="playerScore">0</b></div>
        <div>CPU <b id="cpuScore">0</b></div>
        <div>Clock <b id="clock">90</b></div>
      </div>
    </div>

    <div class="app">
      <aside class="panel roster-panel">
        <h2 class="section-title">Legends</h2>
        <div id="legendsList" class="roster-list"></div>
        <h2 class="section-title" style="margin-top: 18px;">Active Stars</h2>
        <div id="activeList" class="roster-list"></div>
      </aside>

      <main class="panel court-panel">
        <canvas id="gameCanvas" width="920" height="520"></canvas>
        <div class="hud">
          <div class="hud-top">
            <div class="team-score"><small>Player</small><b id="teamScoreText">0</b></div>
            <div class="center-badges">
              <div class="badge" id="possessionBadge">Possession: You</div>
              <div class="badge" id="shotClockBadge">Shot Clock: 24</div>
              <div class="badge" id="rankBadge">Rank: Rookie</div>
            </div>
            <div class="team-score"><small>CPU</small><b id="cpuScoreText">0</b></div>
          </div>
        </div>
      </main>

      <aside class="panel controls-panel">
        <div class="summary">
          <h3 id="playerName">Select a player</h3>
          <div class="stats">
            <div class="stat-item"><span>Shot</span><strong id="shotStat">0</strong></div>
            <div class="stat-item"><span>Speed</span><strong id="speedStat">0</strong></div>
            <div class="stat-item"><span>Defense</span><strong id="defenseStat">0</strong></div>
            <div class="stat-item"><span>Power</span><strong id="powerStat">0</strong></div>
          </div>
        </div>

        <div class="buttons">
          <button class="primary" id="startBtn">Start Match</button>
          <button class="secondary" id="upgradeBtn">Upgrade</button>
          <button id="shootBtn">Shoot</button>
          <button id="passBtn">Pass</button>
          <button id="dribbleBtn">Dribble</button>
          <button id="defendBtn">Defend</button>
          <button style="grid-column: 1 / -1;" id="specialBtn">Signature Move</button>
        </div>

        <div class="meter-wrap">
          <div class="meter-label">Shot timing meter</div>
          <div class="meter"><div class="meter-fill" id="shotMeter"></div></div>
        </div>

        <div class="tips">
          <strong>Controls</strong>
          <ul>
            <li>Move: A / D</li>
            <li>Jump: W</li>
            <li>Shoot: Space</li>
            <li>Pass: P</li>
            <li>Defend: F</li>
            <li>Special: E</li>
          </ul>
        </div>
      </aside>
    </div>

    <script>
      const legends = [
        { name: 'Michael Jordan', team: 'Bulls', pos: 'G', shot: 99, speed: 88, defense: 81, power: 85, signature: 'Fadeaway', rating: 99 },
        { name: 'Kareem Abdul-Jabbar', team: 'Bucks', pos: 'C', shot: 92, speed: 70, defense: 90, power: 93, signature: 'Sky Hook', rating: 99 },
        { name: 'LeBron James', team: 'Lakers', pos: 'F', shot: 96, speed: 94, defense: 88, power: 92, signature: 'Transition Slam', rating: 98 },
        { name: 'Magic Johnson', team: 'Lakers', pos: 'PG', shot: 91, speed: 92, defense: 80, power: 70, signature: 'No-Look Pass', rating: 96 },
        { name: 'Larry Bird', team: 'Celtics', pos: 'F', shot: 96, speed: 82, defense: 84, power: 78, signature: 'Three-Level Scoring', rating: 95 },
        { name: 'Kobe Bryant', team: 'Lakers', pos: 'G', shot: 96, speed: 89, defense: 78, power: 84, signature: 'Mamba Fade', rating: 97 },
        { name: 'Shaquille ONeal', team: 'Magic', pos: 'C', shot: 74, speed: 80, defense: 85, power: 99, signature: 'Monster Dunk', rating: 96 },
        { name: 'Hakeem Olajuwon', team: 'Rockets', pos: 'C', shot: 84, speed: 81, defense: 92, power: 90, signature: 'Dream Shake', rating: 95 },
        { name: 'Tim Duncan', team: 'Spurs', pos: 'C', shot: 88, speed: 72, defense: 94, power: 85, signature: 'Bank Shot', rating: 94 },
        { name: 'Kevin Durant', team: 'Suns', pos: 'F', shot: 98, speed: 87, defense: 80, power: 76, signature: 'One-Legged Jumper', rating: 97 },
        { name: 'Stephen Curry', team: 'Warriors', pos: 'PG', shot: 99, speed: 86, defense: 72, power: 68, signature: 'Deep Range', rating: 98 },
        { name: 'Wilt Chamberlain', team: 'Warriors', pos: 'C', shot: 82, speed: 78, defense: 86, power: 99, signature: 'Power Finish', rating: 97 }
      ];

      const activePlayers = [
        { name: 'Luka Doncic', team: 'Mavericks', pos: 'PG', shot: 96, speed: 90, defense: 68, power: 74, signature: 'Stepback', rating: 96 },
        { name: 'Jayson Tatum', team: 'Celtics', pos: 'F', shot: 94, speed: 86, defense: 80, power: 82, signature: 'Pull-Up', rating: 94 },
        { name: 'Giannis Antetokounmpo', team: 'Bucks', pos: 'F', shot: 81, speed: 93, defense: 82, power: 99, signature: 'Transition Finish', rating: 95 },
        { name: 'Shai Gilgeous-Alexander', team: 'Thunder', pos: 'G', shot: 91, speed: 89, defense: 77, power: 80, signature: 'Mid-Range', rating: 93 },
        { name: 'Victor Wembanyama', team: 'Spurs', pos: 'C', shot: 85, speed: 81, defense: 91, power: 97, signature: 'Sky Finish', rating: 95 },
        { name: 'Ja Morant', team: 'Grizzlies', pos: 'G', shot: 87, speed: 96, defense: 60, power: 74, signature: 'Floater Burst', rating: 91 },
        { name: 'Anthony Edwards', team: 'Timberwolves', pos: 'G', shot: 88, speed: 92, defense: 72, power: 84, signature: 'Explosive Drive', rating: 92 },
        { name: 'Nikola Jokic', team: 'Nuggets', pos: 'C', shot: 90, speed: 79, defense: 78, power: 87, signature: 'Playmaker Hook', rating: 96 },
        { name: 'Jalen Brunson', team: 'Knicks', pos: 'PG', shot: 90, speed: 87, defense: 78, power: 72, signature: 'Clutch Shot', rating: 91 },
        { name: 'Tyrese Maxey', team: '76ers', pos: 'G', shot: 89, speed: 92, defense: 72, power: 74, signature: 'Speed Drive', rating: 90 }
      ];

      let selectedPlayer = legends[0];
      let playerScore = 0;
      let cpuScore = 0;
      let timer = 90;
      let shotMeter = 0;
      let matchRunning = false;
      let rank = 'Rookie';
      let possession = 'you';

      const keys = { left:false, right:false, jump:false };
      const user = { x: 160, y: 334, w: 34, h: 52, vy:0, onGround:true, dir:1 };
      const cpu = { x: 720, y: 334, w: 34, h: 52, dir:-1 };
      const ball = { x: 180, y: 310, r: 10, possessor:'user', vx:0, vy:0 };

      const legendsList = document.getElementById('legendsList');
      const activeList = document.getElementById('activeList');
      const playerNameEl = document.getElementById('playerName');
      const shotStatEl = document.getElementById('shotStat');
      const speedStatEl = document.getElementById('speedStat');
      const defenseStatEl = document.getElementById('defenseStat');
      const powerStatEl = document.getElementById('powerStat');
      const shotMeterEl = document.getElementById('shotMeter');
      const playerScoreEl = document.getElementById('playerScore');
      const cpuScoreEl = document.getElementById('cpuScore');
      const clockEl = document.getElementById('clock');
      const teamScoreTextEl = document.getElementById('teamScoreText');
      const cpuScoreTextEl = document.getElementById('cpuScoreText');
      const possessionBadgeEl = document.getElementById('possessionBadge');
      const shotClockBadgeEl = document.getElementById('shotClockBadge');
      const rankBadgeEl = document.getElementById('rankBadge');
      const ctx = document.getElementById('gameCanvas').getContext('2d');

      function makeRosterCard(player, parent) {
        const card = document.createElement('div');
        card.className = 'player-card' + (selectedPlayer.name === player.name ? ' active' : '');
        card.innerHTML = `
          <div class="avatar">${player.name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase()}</div>
          <div class="name-box">
            <strong>${player.name}</strong>
            <small>${player.team} · ${player.pos}</small>
          </div>
          <div class="rating">${player.rating}</div>
        `;
        card.addEventListener('click', () => {
          selectedPlayer = player;
          renderRoster();
          updateSelectedPlayerUI();
        });
        parent.appendChild(card);
      }

      function renderRoster() {
        legendsList.innerHTML = '';
        activeList.innerHTML = '';
        legends.forEach(p => makeRosterCard(p, legendsList));
        activePlayers.forEach(p => makeRosterCard(p, activeList));
      }

      function updateSelectedPlayerUI() {
        playerNameEl.textContent = selectedPlayer.name;
        shotStatEl.textContent = selectedPlayer.shot;
        speedStatEl.textContent = selectedPlayer.speed;
        defenseStatEl.textContent = selectedPlayer.defense;
        powerStatEl.textContent = selectedPlayer.power;

        const total = selectedPlayer.shot + selectedPlayer.speed + selectedPlayer.defense + selectedPlayer.power;
        rank = total >= 350 ? 'Mythic' : total >= 320 ? 'Elite' : total >= 295 ? 'Star' : 'Rookie';
        rankBadgeEl.textContent = `Rank: ${rank}`;
      }

      function refreshHud() {
        playerScoreEl.textContent = playerScore;
        cpuScoreEl.textContent = cpuScore;
        clockEl.textContent = timer;
        teamScoreTextEl.textContent = playerScore;
        cpuScoreTextEl.textContent = cpuScore;
        possessionBadgeEl.textContent = `Possession: ${possession === 'you' ? 'You' : 'CPU'}`;
        shotClockBadgeEl.textContent = `Shot Clock: ${Math.max(0, 24 - (90 - timer) % 24)}`;
        rankBadgeEl.textContent = `Rank: ${rank}`;
        shotMeterEl.style.width = shotMeter + '%';
      }

      function startMatch() {
        matchRunning = true;
        playerScore = 0;
        cpuScore = 0;
        timer = 90;
        shotMeter = 20;
        possession = 'you';
        ball.possessor = 'user';
        user.x = 150; user.y = 334; user.vy = 0; user.onGround = true;
        cpu.x = 720; cpu.y = 334;
        refreshHud();
      }

      function shoot() {
        if (!matchRunning || ball.possessor !== 'user') return;
        const difficulty = 0.46 + selectedPlayer.shot / 170;
        const success = Math.random() < Math.min(0.96, difficulty + shotMeter / 150);

        shotMeter = 0;
        ball.possessor = 'none';
        if (success) {
          const points = shotMeter > 85 ? 3 : 2;
          playerScore += points;
          possession = 'cpu';
        } else {
          possession = 'cpu';
        }
        refreshHud();
        setTimeout(() => {
          ball.possessor = 'cpu';
          possession = 'cpu';
        }, 240);
      }

      function passBall() {
        if (!matchRunning || ball.possessor !== 'user') return;
        ball.possessor = 'cpu';
        possession = 'cpu';
        refreshHud();
      }

      function dribbleMove() {
        if (!matchRunning || ball.possessor !== 'user') return;
        shotMeter = Math.min(100, shotMeter + 18);
        refreshHud();
      }

      function defendMove() {
        if (!matchRunning) return;
        if (ball.possessor === 'cpu') {
          const chance = Math.random() < (selectedPlayer.defense / 100) * 0.8;
          if (chance) {
            ball.possessor = 'user';
            possession = 'you';
          }
        }
        refreshHud();
      }

      function signatureMove() {
        if (!matchRunning || ball.possessor !== 'user') return;
        const bonus = selectedPlayer.power / 100 + selectedPlayer.shot / 150;
        const success = Math.random() < Math.min(0.92, 0.45 + bonus);
        if (success) {
          playerScore += selectedPlayer.name.includes('Kareem') ? 3 : 2;
        }
        ball.possessor = 'cpu';
        possession = 'cpu';
        refreshHud();
      }

      function doCpuResponse() {
        if (!matchRunning) return;
        const cpuChance = 0.46 + (Math.random() * 0.2);
        if (Math.random() < cpuChance) {
          cpuScore += Math.random() < 0.5 ? 2 : 3;
          ball.possessor = 'user';
          possession = 'you';
        }
        refreshHud();
      }

      function updatePhysics() {
        if (keys.left) user.x -= 5;
        if (keys.right) user.x += 5;
        if (keys.jump && user.onGround) {
          user.vy = -18;
          user.onGround = false;
        }

        user.vy += 0.8;
        user.y += user.vy;
        if (user.y + user.h >= 420) {
          user.y = 420 - user.h;
          user.vy = 0;
          user.onGround = true;
        }

        user.x = Math.max(60, Math.min(280, user.x));
        cpu.x += (user.x < cpu.x ? -1 : 1) * 0.8;
        cpu.x = Math.max(600, Math.min(820, cpu.x));

        if (ball.possessor === 'user') {
          ball.x = user.x + 16;
          ball.y = user.y - 8;
        } else if (ball.possessor === 'cpu') {
          ball.x = cpu.x + 16;
          ball.y = cpu.y - 8;
        } else {
          ball.x += ball.vx;
          ball.y += ball.vy;
          ball.vy += 0.22;
        }
      }

      function drawCourt() {
        ctx.clearRect(0,0,920,520);
        ctx.fillStyle = '#0d714c';
        ctx.fillRect(0,0,920,520);

        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(460, 0); ctx.lineTo(460, 520); ctx.stroke();
        ctx.beginPath(); ctx.arc(460, 260, 80, 0, Math.PI * 2); ctx.stroke();

        ctx.strokeRect(60, 160, 180, 240);
        ctx.strokeRect(680, 160, 180, 240);

        ctx.fillStyle = '#fff';
        ctx.fillRect(760, 120, 30, 60);
        ctx.fillRect(780, 120, 4, 60);

        drawPlayer(user.x, user.y, '#4cc9f0', true);
        drawPlayer(cpu.x, cpu.y, '#ef476f', false);

        ctx.beginPath();
        ctx.fillStyle = '#ffca3a';
        ctx.arc(ball.x, ball.y, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(20, 20, 220, 18);
        ctx.fillStyle = '#90be6d';
        ctx.fillRect(20, 20, 220 * (shotMeter / 100), 18);
      }

      function drawPlayer(x, y, color, isUser) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 34, 52);
        ctx.fillStyle = '#fff';
        ctx.fillRect(x + 6, y - 18, 22, 16);
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 8, y + 14, 7, 18);
        ctx.fillRect(x + 19, y + 14, 7, 18);
      }

      function animate() {
        updatePhysics();
        drawCourt();
        requestAnimationFrame(animate);
      }

      document.getElementById('startBtn').addEventListener('click', startMatch);
      document.getElementById('shootBtn').addEventListener('click', shoot);
      document.getElementById('passBtn').addEventListener('click', passBall);
      document.getElementById('dribbleBtn').addEventListener('click', dribbleMove);
      document.getElementById('defendBtn').addEventListener('click', defendMove);
      document.getElementById('specialBtn').addEventListener('click', signatureMove);
      document.getElementById('upgradeBtn').addEventListener('click', () => {
        selectedPlayer.shot = Math.min(99, selectedPlayer.shot + 1);
        selectedPlayer.speed = Math.min(99, selectedPlayer.speed + 1);
        selectedPlayer.defense = Math.min(99, selectedPlayer.defense + 1);
        selectedPlayer.power = Math.min(99, selectedPlayer.power + 1);
        updateSelectedPlayerUI();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'w' || e.key === 'ArrowUp') keys.jump = true;
        if (e.code === 'Space') shoot();
        if (e.key === 'p') passBall();
        if (e.key === 'f') defendMove();
        if (e.key === 'e') signatureMove();
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'w' || e.key === 'ArrowUp') keys.jump = false;
      });

      setInterval(() => {
        if (!matchRunning) return;
        timer = Math.max(0, timer - 1);
        shotMeter = Math.min(100, shotMeter + 5);
        refreshHud();
        if (timer === 0) matchRunning = false;
      }, 1000);

      setInterval(() => {
        if (matchRunning && Math.random() < 0.15) doCpuResponse();
      }, 700);

      renderRoster();
      updateSelectedPlayerUI();
      refreshHud();
      animate();
    </script>
  </body>
</html>
