<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketBros Pro</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100vh; background: linear-gradient(180deg, #07151d, #112a3c 50%, #081823 100%);
        color: #edf6ff; font-family: Arial, sans-serif;
      }
      body {
        display: grid; place-items: center;
      }
      .game-wrap {
        position: relative; width: min(96vw, 980px); margin: 16px auto;
      }
      .hud {
        position: absolute; top: 12px; left: 14px; right: 14px; display: flex;
        justify-content: space-between; align-items: center; gap: 12px; pointer-events: none;
      }
      .badge {
        background: rgba(7, 19, 26, 0.78);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 0.95rem;
        letter-spacing: 0.02em;
      }
      canvas {
        display: block; width: 100%; height: auto;
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.12);
        background: linear-gradient(180deg, #0a1a24, #132f46 55%, #091520);
        box-shadow: 0 30px 60px rgba(0,0,0,0.32);
      }
    </style>
  </head>
  <body>
    <div class="game-wrap">
      <div class="hud">
        <div class="badge" id="scoreText">You 0 - 0 CPU</div>
        <div class="badge" id="timeText">60.0</div>
        <div class="badge" id="statusText">Drive to the rim</div>
      </div>
      <canvas id="game" width="980" height="620"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const state = {
        playerScore: 0,
        cpuScore: 0,
        timeLeft: 60,
        lastTime: 0,
        keys: { left: false, right: false, up: false, down: false, shoot: false },
        gameOver: false,
      };

      const player = {
        x: 175,
        y: 470,
        w: 26,
        h: 52,
        speed: 5.2,
        hasBall: true,
        facing: 1,
      };

      const cpu = {
        x: 720,
        y: 470,
        w: 26,
        h: 52,
        speed: 4.6,
        hasBall: false,
        facing: -1,
      };

      const hoop = { x: 820, y: 155, radius: 18 };
      const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 10, carrier: 'player', inAir: false };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function resetPositions() {
        player.x = 175; player.y = 470; player.hasBall = true; player.facing = 1;
        cpu.x = 720; cpu.y = 470; cpu.hasBall = false; cpu.facing = -1;
        ball.x = player.x + 12; ball.y = player.y - 18; ball.vx = 0; ball.vy = 0; ball.inAir = false; ball.carrier = 'player';
      }

      function playerShoot() {
        if (!player.hasBall || ball.inAir || state.gameOver) return;
        const targetX = hoop.x + (Math.random() * 30 - 15);
        const targetY = hoop.y + 14;
        const dx = targetX - (player.x + 12);
        const dy = targetY - (player.y - 18);
        ball.inAir = true;
        ball.carrier = 'air';
        ball.vx = dx * 0.13;
        ball.vy = -Math.abs(dy) * 0.14 - 10.4;
        player.hasBall = false;
        state.keys.shoot = false;
      }

      function cpuShoot() {
        if (cpu.hasBall === false || ball.inAir || state.gameOver) return;
        const targetX = 190 + Math.random() * 30;
        const dx = targetX - cpu.x;
        const dy = hoop.y - (cpu.y - 18);
        ball.inAir = true;
        ball.carrier = 'air';
        ball.vx = dx * 0.13;
        ball.vy = -Math.abs(dy) * 0.14 - 10.1;
        cpu.hasBall = false;
      }

      function updatePlayer() {
        let dx = 0;
        let dy = 0;
        if (state.keys.left) dx -= 1;
        if (state.keys.right) dx += 1;
        if (state.keys.up) dy -= 1;
        if (state.keys.down) dy += 1;

        player.x = clamp(player.x + dx * player.speed, 110, 360);
        player.y = clamp(player.y + dy * player.speed, 400, 560);
        if (dx < 0) player.facing = -1;
        if (dx > 0) player.facing = 1;

        if (player.hasBall) {
          ball.x = player.x + 12;
          ball.y = player.y - 18 + Math.sin(performance.now() * 0.02) * 2.2;
        }

        if (state.keys.shoot) {
          playerShoot();
        }
      }

      function updateCPU() {
        if (ball.inAir) return;

        if (cpu.hasBall) {
          const targetX = 760;
          const targetY = 450;
          cpu.x += (targetX - cpu.x) * 0.06;
          cpu.y += (targetY - cpu.y) * 0.06;
          cpu.x = clamp(cpu.x, 560, 860);
          cpu.y = clamp(cpu.y, 410, 560);

          if (Math.random() < 0.03) {
            cpuShoot();
          }

          ball.x = cpu.x - 10;
          ball.y = cpu.y - 14 + Math.sin(performance.now() * 0.02 + 40) * 2.0;
          return;
        }

        const shouldTakeBall = Math.random() < 0.02;
        if (shouldTakeBall && !player.hasBall) {
          cpu.hasBall = true;
          ball.carrier = 'cpu';
        }

        const targetX = player.x + 90;
        cpu.x += (targetX - cpu.x) * 0.045;
        cpu.x = clamp(cpu.x, 590, 860);
        cpu.y += (player.y - cpu.y) * 0.05;
        cpu.y = clamp(cpu.y, 410, 560);

        if (cpu.hasBall) {
          ball.x = cpu.x - 12;
          ball.y = cpu.y - 18 + Math.sin(performance.now() * 0.02 + 40) * 2.1;
        }
      }

      function updateBall() {
        if (!ball.inAir) return;

        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vy += 0.42;

        const rimLeft = hoop.x - 36;
        const rimRight = hoop.x + 36;
        const rimTop = hoop.y - 6;
        const rimBottom = hoop.y + 24;

        if (ball.x > rimLeft && ball.x < rimRight && ball.y > rimTop && ball.y < rimBottom && ball.vy > 0) {
          const centerHit = ball.x > hoop.x - 13 && ball.x < hoop.x + 13 && ball.y > hoop.y - 8 && ball.y < hoop.y + 10;
          if (centerHit) {
            if (ball.x < canvas.width / 2) {
              state.playerScore += 2;
              document.getElementById('statusText').textContent = 'Nice bucket!';
            } else {
              state.cpuScore += 2;
              document.getElementById('statusText').textContent = 'CPU scores';
            }
            ball.inAir = false; ball.vx = 0; ball.vy = 0; resetPositions();
            return;
          }
        }

        if (ball.y > 570) {
          ball.inAir = false; ball.vx = 0; ball.vy = 0;
          if (ball.x < canvas.width / 2) {
            player.hasBall = true; ball.carrier = 'player';
            ball.x = player.x + 12; ball.y = player.y - 18;
            document.getElementById('statusText').textContent = 'Rebound';
          } else {
            cpu.hasBall = true; ball.carrier = 'cpu';
            ball.x = cpu.x - 12; ball.y = cpu.y - 18;
            document.getElementById('statusText').textContent = 'CPU rebound';
          }
        }
      }

      function drawCourt() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bg.addColorStop(0, '#0b1e2a');
        bg.addColorStop(1, '#183448');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1f7b6c';
        ctx.fillRect(0, 520, canvas.width, 100);

        ctx.strokeStyle = 'rgba(255,255,255,0.52)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(80, 80); ctx.lineTo(80, 520); ctx.lineTo(900, 520); ctx.lineTo(900, 80);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(490, 80); ctx.lineTo(490, 520); ctx.stroke();
        ctx.beginPath();
        ctx.arc(490, 132, 82, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        ctx.arc(490, 155, 18, 0, Math.PI * 2); ctx.stroke();

        ctx.fillStyle = '#ffb703';
        ctx.fillRect(785, 118, 18, 58);
        ctx.fillRect(770, 143, 48, 10);
        ctx.fillStyle = '#edf6ff';
        ctx.fillRect(825, 138, 44, 10);

        ctx.fillStyle = '#0c2636';
        for (let i = 0; i < 12; i++) {
          const x = 50 + i * 62;
          const height = 44 + (i % 4) * 30;
          ctx.fillRect(x, 520 - height, 42, height);
        }
      }

      function drawPlayer(entity, color) {
        const bodyX = entity.x - entity.w / 2;
        const bodyY = entity.y - entity.h / 2;

        ctx.fillStyle = color;
        ctx.fillRect(bodyX, bodyY, entity.w, entity.h);

        ctx.fillStyle = '#f2f7ff';
        ctx.beginPath();
        ctx.arc(bodyX + entity.w / 2, bodyY - 12, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f2f7ff';
        ctx.fillRect(bodyX + 10, bodyY + entity.h - 4, 6, 18);
        ctx.fillRect(bodyX + entity.w - 16, bodyY + entity.h - 4, 6, 18);
      }

      function drawBall() {
        if (ball.carrier === 'player') {
          ball.x = player.x + 12; ball.y = player.y - 20;
        }
        if (ball.carrier === 'cpu') {
          ball.x = cpu.x - 10; ball.y = cpu.y - 18;
        }

        ctx.fillStyle = '#f5d04f';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#d8aa18';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawUI() {
        ctx.fillStyle = '#edf6ff';
        ctx.font = 'bold 24px Arial';
        ctx.fillText(`You ${state.playerScore} - ${state.cpuScore} CPU`, 40, 40);
        ctx.fillText(`${state.timeLeft.toFixed(1)}s`, 840, 40);
      }

      function render() {
        drawCourt();
        drawPlayer(player, '#4cc9f0');
        drawPlayer(cpu, '#ef476f');
        drawBall();
        drawUI();
      }

      function tick(timestamp) {
        if (!state.lastTime) state.lastTime = timestamp;
        const delta = (timestamp - state.lastTime) / 1000;
        state.lastTime = timestamp;

        if (!state.gameOver) {
          state.timeLeft -= delta;
          if (state.timeLeft <= 0) {
            state.timeLeft = 0;
            state.gameOver = true;
            document.getElementById('statusText').textContent = state.playerScore > state.cpuScore ? 'Victory!' : 'Game over';
          }
        }

        if (!state.gameOver) {
          updatePlayer();
          updateCPU();
          updateBall();
        }

        render();
        document.getElementById('scoreText').textContent = `You ${state.playerScore} - ${state.cpuScore} CPU`;
        document.getElementById('timeText').textContent = `${state.timeLeft.toFixed(1)}`;

        requestAnimationFrame(tick);
      }

      window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'a' || event.key === 'ArrowLeft') state.keys.left = true;
        if (key === 'd' || event.key === 'ArrowRight') state.keys.right = true;
        if (key === 'w' || event.key === 'ArrowUp') state.keys.up = true;
        if (key === 's' || event.key === 'ArrowDown') state.keys.down = true;
        if (key === ' ' || key === 'f') state.keys.shoot = true;
      });

      window.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'a' || event.key === 'ArrowLeft') state.keys.left = false;
        if (key === 'd' || event.key === 'ArrowRight') state.keys.right = false;
        if (key === 'w' || event.key === 'ArrowUp') state.keys.up = false;
        if (key === 's' || event.key === 'ArrowDown') state.keys.down = false;
      });

      resetPositions();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
