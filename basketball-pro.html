<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketBros Pro</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(180deg, #081621, #112b3d 45%, #0a101a 100%);
        color: white; font-family: Arial, sans-serif;
      }
      .hud-shell {
        width: min(96vw, 980px); border: 2px solid rgba(255,255,255,0.12); border-radius: 20px; background: rgba(9, 20, 28, 0.94); overflow: hidden; box-shadow: 0 28px 60px rgba(0,0,0,0.35);
      }
      canvas { display: block; width: 100%; height: auto; background: linear-gradient(180deg, #0a1621, #111f2b); }
      .ui {
        position: absolute; width: min(96vw, 980px); pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 20px; font-weight: 700;
      }
      .score { display: flex; gap: 18px; font-size: 1.1rem; }
      .badge { padding: 10px 14px; border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; background: rgba(255,255,255,0.04); }
    </style>
  </head>
  <body>
    <div style="position: relative;">
      <div class="ui">
        <div class="score">
          <div class="badge" id="scoreboard">You 0 - 0 CPU</div>
          <div class="badge" id="clock">30.0</div>
        </div>
        <div class="badge" id="status">Drive to the rim</div>
      </div>
      <div class="hud-shell">
        <canvas id="game" width="980" height="620"></canvas>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const state = {
        playerScore: 0,
        cpuScore: 0,
        timer: 30,
        lastTime: 0,
        court: { left: 60, right: 920, top: 80, bottom: 560 },
        keys: { left: false, right: false, up: false, down: false, shoot: false },
      };

      const player = {
        x: 220,
        y: 470,
        w: 26,
        h: 46,
        vx: 0,
        vy: 0,
        onGround: true,
        facing: 1,
        hasBall: true,
        dribbleFrame: 0,
      };

      const cpu = {
        x: 730,
        y: 470,
        w: 26,
        h: 46,
        vx: 0,
        vy: 0,
        onGround: true,
        hasBall: false,
        facing: -1,
        aiTimer: 0,
      };

      const ball = {
        x: player.x + 10,
        y: player.y - 18,
        vx: 0,
        vy: 0,
        r: 10,
        inFlight: false,
        owner: 'player',
        shotOrigin: null,
        target: null,
      };

      const hoop = { x: 830, y: 92, r: 18 };

      function resetPositions() {
        player.x = 220; player.y = 470; player.vx = 0; player.vy = 0; player.onGround = true; player.hasBall = true;
        cpu.x = 730; cpu.y = 470; cpu.vx = 0; cpu.vy = 0; cpu.onGround = true; cpu.hasBall = false;
        ball.x = player.x + 10; ball.y = player.y - 18; ball.vx = 0; ball.vy = 0; ball.inFlight = false; ball.owner = 'player';
      }

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function shootBall() {
        if (!player.hasBall || ball.inFlight) return;
        const targetX = hoop.x + (Math.random() * 18 - 9);
        const targetY = hoop.y + 8;
        const dx = targetX - (player.x + 18);
        const dy = targetY - (player.y - 16);
        const power = 10.5;
        ball.owner = 'air';
        ball.inFlight = true;
        ball.shotOrigin = { x: player.x + 18, y: player.y - 16 };
        ball.target = { x: targetX, y: targetY };
        ball.vx = dx * 0.09;
        ball.vy = -Math.abs(dy) * 0.14 - power;
        player.hasBall = false;
      }

      function cpuShoot() {
        if (cpu.hasBall || ball.inFlight) return;
        cpu.hasBall = true;
        const targetX = 170 + Math.random() * 40;
        const targetY = 110;
        const dx = targetX - cpu.x;
        const dy = targetY - (cpu.y - 12);
        ball.owner = 'cpu';
        ball.inFlight = true;
        ball.shotOrigin = { x: cpu.x - 10, y: cpu.y - 16 };
        ball.target = { x: targetX, y: targetY };
        ball.vx = dx * 0.08;
        ball.vy = -Math.abs(dy) * 0.12 - 9.8;
        cpu.hasBall = false;
      }

      function updatePlayer() {
        let moveX = 0;
        if (state.keys.left) moveX -= 1;
        if (state.keys.right) moveX += 1;
        if (state.keys.up) player.vy -= 0.9;
        if (state.keys.down) player.vy += 0.4;

        player.vx = moveX * 5.2;
        player.x += player.vx;
        player.x = clamp(player.x, 80, 320);

        if (player.hasBall) {
          ball.x = player.x + 10;
          ball.y = player.y - 18 + Math.sin(Date.now() * 0.01 + player.x) * 2.4;
        }

        if (state.keys.shoot) {
          shootBall();
          state.keys.shoot = false;
        }

        if (player.y < 470) {
          player.vy += 0.7;
          player.y += player.vy;
        } else {
          player.y = 470;
          player.vy = 0;
          player.onGround = true;
        }
        if (player.y > 470) player.y = 470;
      }

      function updateCPU() {
        const targetX = player.x + 80;
        cpu.x += (targetX - cpu.x) * 0.03;
        cpu.x = clamp(cpu.x, 640, 860);
        cpu.y = 470;

        if (!cpu.hasBall && !ball.inFlight && Math.random() < 0.012) {
          cpu.hasBall = true;
        }

        if (cpu.hasBall) {
          ball.x = cpu.x - 10;
          ball.y = cpu.y - 18 + Math.sin(Date.now() * 0.02 + cpu.x) * 2.6;
          if (Math.random() < 0.027) cpuShoot();
        }
      }

      function updateBall() {
        if (!ball.inFlight) return;

        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vy += 0.42;

        const rimLeft = hoop.x - 36;
        const rimRight = hoop.x + 36;
        const rimTop = hoop.y - 4;
        const rimBottom = hoop.y + 26;

        if (ball.x > rimLeft && ball.x < rimRight && ball.y > rimTop && ball.y < rimBottom && ball.vy > 0) {
          const scoreX = ball.x;
          const scoreY = ball.y;
          const inNet = scoreX > hoop.x - 14 && scoreX < hoop.x + 14 && scoreY > hoop.y && scoreY < hoop.y + 16;
          if (inNet) {
            if (ball.shotOrigin.x < canvas.width / 2) {
              state.playerScore += 2;
              document.getElementById('status').textContent = 'Nice bucket!';
            } else {
              state.cpuScore += 2;
              document.getElementById('status').textContent = 'CPU scores';
            }
            ball.inFlight = false;
            ball.vx = 0; ball.vy = 0;
            resetPositions();
            return;
          }
        }

        if (ball.y > 560) {
          ball.inFlight = false;
          ball.vx = 0; ball.vy = 0;
          if (ball.shotOrigin.x < canvas.width / 2) {
            document.getElementById('status').textContent = 'Missed shot';
          } else {
            document.getElementById('status').textContent = 'Defense gets it';
          }
          if (Math.random() < 0.6) {
            player.hasBall = true;
            ball.owner = 'player';
            ball.x = player.x + 10;
            ball.y = player.y - 18;
          } else {
            cpu.hasBall = true;
            ball.owner = 'cpu';
            ball.x = cpu.x - 10;
            ball.y = cpu.y - 18;
          }
        }
      }

      function drawBackground() {
        ctx.fillStyle = '#081f2d';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#0d2234');
        sky.addColorStop(1, '#20384f');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#2a2d31';
        for (let i = 0; i < 14; i++) {
          const x = i * 70 + 26;
          const h = 80 + (i % 4) * 35;
          ctx.fillRect(x, 460 - h, 40, h);
        }

        ctx.fillStyle = '#1a8d7a';
        ctx.fillRect(0, 530, canvas.width, 90);

        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(80, 80);
        ctx.lineTo(80, 530);
        ctx.lineTo(900, 530);
        ctx.lineTo(900, 80);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(490, 80);
        ctx.lineTo(490, 530);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(490, 150, 80, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(490, 170, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#ffb703';
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffb703';
        ctx.fillRect(780, 90, 18, 60);
        ctx.fillRect(770, 115, 38, 10);
        ctx.fillStyle = '#edf6ff';
        ctx.fillRect(820, 125, 50, 10);
      }

      function drawPlayer(entity, color) {
        ctx.fillStyle = color;
        ctx.fillRect(entity.x, entity.y, entity.w, entity.h);
        ctx.fillStyle = '#dfe9ff';
        ctx.fillRect(entity.x + 10, entity.y - 12, 6, 12);
        ctx.fillStyle = '#111';
        ctx.fillRect(entity.x + 11, entity.y + 18, 5, 14);
      }

      function drawBall() {
        if (ball.owner === 'player') {
          ball.x = player.x + 10;
          ball.y = player.y - 18;
        }
        if (ball.owner === 'cpu') {
          ball.x = cpu.x - 10;
          ball.y = cpu.y - 18;
        }
        ctx.fillStyle = '#f7d154';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#d0a334';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function render() {
        drawBackground();
        drawPlayer(player, '#4cc9f0');
        drawPlayer(cpu, '#ef476f');
        drawBall();

        ctx.fillStyle = '#edf6ff';
        ctx.font = 'bold 26px Arial';
        ctx.fillText(`You ${state.playerScore} - ${state.cpuScore} CPU`, 40, 40);
        ctx.fillText(`${state.timer.toFixed(1)}s`, 860, 40);
      }

      function tick(ts) {
        const delta = (ts - state.lastTime) / 1000 || 0.016;
        state.lastTime = ts;

        state.timer -= delta;
        if (state.timer <= 0) {
          document.getElementById('status').textContent = state.playerScore > state.cpuScore ? 'Victory!' : 'Game over';
          state.timer = 0;
        }

        updatePlayer();
        updateCPU();
        updateBall();
        render();

        document.getElementById('scoreboard').textContent = `You ${state.playerScore} - ${state.cpuScore} CPU`;
        document.getElementById('clock').textContent = `${state.timer.toFixed(1)}`;

        requestAnimationFrame(tick);
      }

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') state.keys.left = true;
        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') state.keys.right = true;
        if (event.key === 'ArrowUp' || event.key.toLowerCase() === 'w') state.keys.up = true;
        if (event.key === 'ArrowDown' || event.key.toLowerCase() === 's') state.keys.down = true;
        if (event.key === ' ' || event.key.toLowerCase() === 'f') state.keys.shoot = true;
      });

      window.addEventListener('keyup', (event) => {
        if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') state.keys.left = false;
        if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') state.keys.right = false;
        if (event.key === 'ArrowUp' || event.key.toLowerCase() === 'w') state.keys.up = false;
        if (event.key === 'ArrowDown' || event.key.toLowerCase() === 's') state.keys.down = false;
      });

      resetPositions();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
