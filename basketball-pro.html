<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketBros Pro</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; min-height: 100vh; background: linear-gradient(180deg, #07151d, #10293c 48%, #091723 100%);
        color: white; font-family: Arial, sans-serif;
      }
      body {
        display: grid; place-items: center;
      }
      .game-wrap {
        position: relative; width: min(96vw, 980px); margin: 18px auto;
      }
      .hud {
        position: absolute; top: 12px; left: 12px; right: 12px; display: flex;
        justify-content: space-between; align-items: center; gap: 12px; pointer-events: none;
      }
      .badge {
        background: rgba(8, 16, 22, 0.72); border: 1px solid rgba(255,255,255,0.14);
        border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 0.96rem;
      }
      canvas {
        display: block; width: 100%; height: auto; border-radius: 18px; border: 2px solid rgba(255,255,255,0.12);
        box-shadow: 0 28px 60px rgba(0,0,0,0.28);
        background: linear-gradient(180deg, #0a1a25, #173147 60%, #0e1722);
      }
    </style>
  </head>
  <body>
    <div class="game-wrap">
      <div class="hud">
        <div class="badge" id="scoreText">You 0 - 0 CPU</div>
        <div class="badge" id="timeText">45.0</div>
        <div class="badge" id="statusText">Drive to the hoop</div>
      </div>
      <canvas id="game" width="980" height="620"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const state = {
        playerScore: 0,
        cpuScore: 0,
        timeLeft: 45,
        lastTime: 0,
        keys: { left: false, right: false, jump: false, shoot: false },
      };

      const player = {
        x: 200,
        y: 470,
        w: 28,
        h: 56,
        vx: 0,
        vy: 0,
        grounded: true,
        hasBall: true,
        facing: 1,
      };

      const cpu = {
        x: 720,
        y: 470,
        w: 28,
        h: 56,
        vx: 0,
        vy: 0,
        grounded: true,
        hasBall: false,
        facing: -1,
      };

      const hoop = { x: 820, y: 134, r: 18 };

      const ball = {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        r: 10,
        carrier: 'player',
        inAir: false,
      };

      function resetPositions() {
        player.x = 200; player.y = 470; player.vx = 0; player.vy = 0; player.grounded = true; player.hasBall = true; player.facing = 1;
        cpu.x = 720; cpu.y = 470; cpu.vx = 0; cpu.vy = 0; cpu.grounded = true; cpu.hasBall = false; cpu.facing = -1;
        ball.x = player.x + 12; ball.y = player.y - 18; ball.vx = 0; ball.vy = 0; ball.inAir = false; ball.carrier = 'player';
      }

      function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }

      function updatePlayer() {
        let move = 0;
        if (state.keys.left) move -= 1;
        if (state.keys.right) move += 1;
        player.vx = move * 5.5;
        player.x += player.vx;
        player.x = clamp(player.x, 100, 350);
        player.facing = move < 0 ? -1 : move > 0 ? 1 : player.facing;

        if (state.keys.jump && player.grounded) {
          player.vy = -14;
          player.grounded = false;
        }

        player.vy += 0.78;
        player.y += player.vy;
        if (player.y >= 470) {
          player.y = 470;
          player.vy = 0;
          player.grounded = true;
        }

        if (player.hasBall) {
          ball.x = player.x + 10;
          ball.y = player.y - 18 + Math.sin(Date.now() * 0.02) * 2.4;
        }

        if (state.keys.shoot && player.hasBall) {
          shotForPlayer();
        }
      }

      function shotForPlayer() {
        const targetX = hoop.x + (Math.random() * 26 - 13);
        const dx = targetX - (player.x + 10);
        const dy = hoop.y - (player.y - 18);
        ball.carrier = 'air';
        ball.inAir = true;
        ball.vx = dx * 0.12;
        ball.vy = -Math.abs(dy) * 0.14 - 9.5;
        player.hasBall = false;
        state.keys.shoot = false;
      }

      function updateCPU() {
        const targetX = player.x + 120;
        cpu.vx = (targetX - cpu.x) * 0.04;
        cpu.x += cpu.vx;
        cpu.x = clamp(cpu.x, 590, 860);
        cpu.facing = cpu.x < player.x ? -1 : 1;

        if (!cpu.hasBall && !ball.inAir && Math.random() < 0.012) {
          cpu.hasBall = true;
          ball.carrier = 'cpu';
        }

        if (cpu.hasBall) {
          ball.x = cpu.x - 10;
          ball.y = cpu.y - 18 + Math.sin(Date.now() * 0.02 + 30) * 2.2;
          if (Math.random() < 0.03) {
            const targetX = 180 + Math.random() * 28;
            const dx = targetX - cpu.x;
            const dy = hoop.y - (cpu.y - 18);
            ball.carrier = 'air';
            ball.inAir = true;
            ball.vx = dx * 0.12;
            ball.vy = -Math.abs(dy) * 0.14 - 9.5;
            cpu.hasBall = false;
          }
        }
      }

      function updateBall() {
        if (!ball.inAir) return;

        ball.x += ball.vx;
        ball.y += ball.vy;
        ball.vy += 0.42;

        const hoopLeft = hoop.x - 32;
        const hoopRight = hoop.x + 32;
        const hoopTop = hoop.y - 20;
        const hoopBottom = hoop.y + 18;

        if (ball.x > hoopLeft && ball.x < hoopRight && ball.y > hoopTop && ball.y < hoopBottom && ball.vy > 0) {
          const scored = ball.x > hoop.x - 12 && ball.x < hoop.x + 12 && ball.y > hoop.y - 10 && ball.y < hoop.y + 8;
          if (scored) {
            if (ball.x < canvas.width / 2) {
              state.playerScore += 2;
              document.getElementById('statusText').textContent = 'Nice bucket!';
            } else {
              state.cpuScore += 2;
              document.getElementById('statusText').textContent = 'CPU scores';
            }
            ball.inAir = false; ball.vx = 0; ball.vy = 0; ball.carrier = 'player';
            resetPositions();
            return;
          }
        }

        if (ball.y > 580) {
          const shotFromLeft = ball.x < canvas.width / 2;
          ball.inAir = false; ball.vx = 0; ball.vy = 0;
          if (shotFromLeft) {
            player.hasBall = true;
            ball.carrier = 'player';
            ball.x = player.x + 12;
            ball.y = player.y - 18;
            document.getElementById('statusText').textContent = 'Rebound';
          } else {
            cpu.hasBall = true;
            ball.carrier = 'cpu';
            ball.x = cpu.x - 10;
            ball.y = cpu.y - 18;
            document.getElementById('statusText').textContent = 'CPU rebound';
          }
        }
      }

      function drawCourt() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#081d2a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1f7c6d';
        ctx.fillRect(0, 530, canvas.width, 90);

        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(90, 90); ctx.lineTo(90, 530); ctx.lineTo(900, 530); ctx.lineTo(900, 90);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(490, 90); ctx.lineTo(490, 530); ctx.stroke();
        ctx.beginPath();
        ctx.arc(490, 150, 82, 0, Math.PI * 2); ctx.stroke();

        ctx.fillStyle = '#ffb703';
        ctx.fillRect(790, 120, 18, 56);
        ctx.fillRect(782, 138, 34, 10);
        ctx.fillStyle = '#edf6ff';
        ctx.fillRect(840, 136, 48, 10);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        for (let i = 0; i < 14; i++) {
          const x = 50 + i * 62;
          ctx.fillRect(x, 452, 38, 75);
        }
      }

      function drawPlayer(entity, color) {
        ctx.fillStyle = color;
        ctx.fillRect(entity.x, entity.y, entity.w, entity.h);
        ctx.fillStyle = '#dfe9ff';
        ctx.fillRect(entity.x + 10, entity.y - 12, 8, 12);
        ctx.fillStyle = '#111';
        ctx.fillRect(entity.x + 11, entity.y + 18, 6, 16);
      }

      function drawBall() {
        if (ball.carrier === 'player') {
          ball.x = player.x + 10; ball.y = player.y - 18;
        }
        if (ball.carrier === 'cpu') {
          ball.x = cpu.x - 10; ball.y = cpu.y - 18;
        }

        ctx.fillStyle = '#f5d04f';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#c59600';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawUI() {
        ctx.fillStyle = '#edf6ff';
        ctx.font = 'bold 24px Arial';
        ctx.fillText(`You ${state.playerScore} - ${state.cpuScore} CPU`, 40, 40);
        ctx.fillText(`${state.timeLeft.toFixed(1)}s`, 840, 40);
      }

      function render() {
        drawCourt();
        drawPlayer(player, '#4cc9f0');
        drawPlayer(cpu, '#ef476f');
        drawBall();
        drawUI();
      }

      function tick(timestamp) {
        if (!state.lastTime) state.lastTime = timestamp;
        const delta = (timestamp - state.lastTime) / 1000;
        state.lastTime = timestamp;

        state.timeLeft -= delta;
        if (state.timeLeft <= 0) {
          state.timeLeft = 0;
          document.getElementById('statusText').textContent = state.playerScore > state.cpuScore ? 'Victory!' : 'Game over';
        }

        updatePlayer();
        updateCPU();
        updateBall();
        render();

        document.getElementById('scoreText').textContent = `You ${state.playerScore} - ${state.cpuScore} CPU`;
        document.getElementById('timeText').textContent = `${state.timeLeft.toFixed(1)}`;

        requestAnimationFrame(tick);
      }

      window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'a' || event.key === 'ArrowLeft') state.keys.left = true;
        if (key === 'd' || event.key === 'ArrowRight') state.keys.right = true;
        if (key === 'w' || event.key === 'ArrowUp') state.keys.jump = true;
        if (key === ' ' || key === 'f') state.keys.shoot = true;
      });

      window.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'a' || event.key === 'ArrowLeft') state.keys.left = false;
        if (key === 'd' || event.key === 'ArrowRight') state.keys.right = false;
        if (key === 'w' || event.key === 'ArrowUp') state.keys.jump = false;
      });

      resetPositions();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
