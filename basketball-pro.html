<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketBros Pro</title>
    <style>
      :root {
        --bg: #09111d;
        --panel: rgba(13, 22, 35, 0.9);
        --panel-2: rgba(21, 35, 55, 0.92);
        --orange: #ffb703;
        --orange-2: #ff7b00;
        --cyan: #4cc9f0;
        --green: #90be6d;
        --red: #ef476f;
        --text: #edf6ff;
        --muted: #b7cde8;
        --line: rgba(255,255,255,0.12);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: linear-gradient(135deg, #0b1220, #152a43 48%, #0d1727);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        background: rgba(0, 0, 0, 0.26);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-weight: 900;
        letter-spacing: 0.04em;
        color: var(--orange);
      }

      .scoreboard {
        display: flex;
        gap: 30px;
        font-weight: 700;
      }

      .scoreboard b { color: var(--cyan); }

      .app {
        display: grid;
        grid-template-columns: 290px 1fr 300px;
        gap: 12px;
        padding: 12px;
        flex: 1;
        min-height: 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.25);
        overflow: hidden;
      }

      .roster-panel {
        padding: 14px;
      }

      .section-title {
        margin: 0 0 12px;
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--orange);
      }

      .roster-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 46vh;
        overflow: auto;
      }

      .player-card {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 10px;
        align-items: center;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 10px;
        cursor: pointer;
      }

      .player-card.active {
        border-color: rgba(255,183,3,0.7);
        background: rgba(255,183,3,0.12);
      }

      .avatar {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(135deg, #dfe9ff, #80d8ff);
        color: #11213d;
        font-weight: 900;
        font-size: 0.72rem;
      }

      .name-box {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .name-box strong {
        font-size: 0.8rem;
      }

      .name-box small {
        color: var(--muted);
        font-size: 0.72rem;
      }

      .rating {
        font-size: 0.86rem;
        font-weight: 800;
        color: var(--orange);
      }

      .court-panel {
        position: relative;
        background: linear-gradient(180deg, rgba(9,40,45,0.6), rgba(7,46,38,0.8));
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .hud-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 14px 18px;
      }

      .team-score {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 12px;
        background: rgba(0,0,0,0.28);
        border-radius: 12px;
        border: 1px solid var(--line);
      }

      .team-score small {
        color: var(--muted);
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .team-score b {
        font-size: 2rem;
      }

      .center-badges {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 0.78rem;
        color: var(--muted);
      }

      .badge {
        background: rgba(255,255,255,0.06);
        border: 1px solid var(--line);
        padding: 7px 10px;
        border-radius: 999px;
      }

      .controls-panel {
        padding: 16px;
      }

      .player-summary {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
      }

      .player-summary h3,
      .meta-title {
        margin: 0 0 10px;
        color: var(--orange);
      }

      .stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 10px;
      }

      .stat-item {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        display: flex;
        justify-content: space-between;
      }

      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
      }

      button {
        appearance: none;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        border-radius: 12px;
        padding: 11px 10px;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: linear-gradient(135deg, var(--orange), var(--orange-2));
        border-color: transparent;
        color: #101010;
      }

      .secondary {
        background: rgba(76,201,240,0.08);
        border-color: rgba(76,201,240,0.4);
        color: var(--cyan);
      }

      .meter-wrap {
        margin-top: 14px;
      }

      .meter-label {
        font-size: 0.7rem;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .meter {
        height: 16px;
        width: 100%;
        background: rgba(255,255,255,0.06);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--line);
      }

      .meter-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--green), var(--orange), var(--red));
        transition: width 0.08s linear;
      }

      .tips {
        margin-top: 14px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(76,201,240,0.04);
        border: 1px solid rgba(76,201,240,0.25);
      }

      .tips ul {
        margin: 8px 0 0 18px;
        padding: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.76rem;
      }

      @media (max-width: 1100px) {
        .app {
          grid-template-columns: 1fr;
        }

        .roster-panel,
        .controls-panel {
          max-height: none;
        }

        .court-panel {
          min-height: 520px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">🏀 BasketBros Pro</div>
      <div class="scoreboard">
        <div>You <b id="playerScore">0</b></div>
        <div>CPU <b id="cpuScore">0</b></div>
        <div>Clock <b id="clock">90</b></div>
      </div>
    </div>

    <div class="app">
      <aside class="panel roster-panel">
        <h2 class="section-title">Legends</h2>
        <div id="legendsList" class="roster-list"></div>

        <h2 class="section-title" style="margin-top: 18px;">Active Stars</h2>
        <div id="activeList" class="roster-list"></div>
      </aside>

      <main class="panel court-panel">
        <canvas id="gameCanvas" width="900" height="520"></canvas>
        <div class="hud">
          <div class="hud-top">
            <div class="team-score">
              <small>Player</small>
              <b id="teamScoreText">0</b>
            </div>
            <div class="center-badges">
              <div class="badge" id="possessionBadge">Possession: You</div>
              <div class="badge" id="shotClockBadge">Shot Clock: 24</div>
              <div class="badge" id="rankBadge">Rank: Rookie</div>
            </div>
            <div class="team-score">
              <small>CPU</small>
              <b id="cpuScoreText">0</b>
            </div>
          </div>
        </div>
      </main>

      <aside class="panel controls-panel">
        <div class="player-summary">
          <h3 id="playerName">Select a player</h3>
          <div class="stat-grid">
            <div class="stat-item"><span>Shot</span><strong id="shotStat">0</strong></div>
            <div class="stat-item"><span>Speed</span><strong id="speedStat">0</strong></div>
            <div class="stat-item"><span>Defense</span><strong id="defenseStat">0</strong></div>
            <div class="stat-item"><span>Power</span><strong id="powerStat">0</strong></div>
          </div>
        </div>

        <div class="buttons">
          <button class="primary" id="startBtn">Start Match</button>
          <button class="secondary" id="upgradeBtn">Upgrade</button>
          <button id="shootBtn">Shoot</button>
          <button id="passBtn">Pass</button>
          <button id="dribbleBtn">Dribble</button>
          <button id="defendBtn">Defend</button>
          <button id="specialBtn" style="grid-column: 1 / -1;">Signature Move</button>
        </div>

        <div class="meter-wrap">
          <div class="meter-label">Shot timing meter</div>
          <div class="meter"><div class="meter-fill" id="shotMeter"></div></div>
        </div>

        <div class="tips">
          <div class="meta-title">Controls</div>
          <ul>
            <li>Move: A / D</li>
            <li>Jump: W</li>
            <li>Shoot: Space</li>
            <li>Pass: P</li>
            <li>Defend: F</li>
            <li>Special: E</li>
          </ul>
        </div>
      </aside>
    </div>

    <script>
      const legends = [
        { name: 'Michael Jordan', team: 'Chicago Bulls', pos: 'G', shot: 99, speed: 88, defense: 81, power: 85, signature: 'Fadeaway', rating: 99, type: 'legend' },
        { name: 'Kareem Abdul-Jabbar', team: 'Milwaukee Bucks', pos: 'C', shot: 92, speed: 70, defense: 90, power: 93, signature: 'Sky Hook', rating: 99, type: 'legend' },
        { name: 'LeBron James', team: 'Los Angeles Lakers', pos: 'F', shot: 96, speed: 94, defense: 88, power: 92, signature: 'Transition Slam', rating: 98, type: 'legend' },
        { name: 'Magic Johnson', team: 'Los Angeles Lakers', pos: 'PG', shot: 91, speed: 92, defense: 80, power: 70, signature: 'No-Look Pass', rating: 96, type: 'legend' },
        { name: 'Larry Bird', team: 'Boston Celtics', pos: 'F', shot: 96, speed: 82, defense: 84, power: 78, signature: 'Three-Level Scoring', rating: 95, type: 'legend' },
        { name: 'Kobe Bryant', team: 'Los Angeles Lakers', pos: 'G', shot: 96, speed: 89, defense: 78, power: 84, signature: 'Mamba Fade', rating: 97, type: 'legend' },
        { name: 'Shaquille ONeal', team: 'Orlando Magic', pos: 'C', shot: 74, speed: 80, defense: 85, power: 99, signature: 'Monster Dunk', rating: 96, type: 'legend' },
        { name: 'Hakeem Olajuwon', team: 'Houston Rockets', pos: 'C', shot: 84, speed: 81, defense: 92, power: 90, signature: 'Dream Shake', rating: 95, type: 'legend' },
        { name: 'Tim Duncan', team: 'San Antonio Spurs', pos: 'C', shot: 88, speed: 72, defense: 94, power: 85, signature: 'Bank Shot', rating: 94, type: 'legend' },
        { name: 'Kevin Durant', team: 'Phoenix Suns', pos: 'F', shot: 98, speed: 87, defense: 80, power: 76, signature: 'One-Legged Jumper', rating: 97, type: 'legend' },
        { name: 'Stephen Curry', team: 'Golden State Warriors', pos: 'PG', shot: 99, speed: 86, defense: 72, power: 68, signature: 'Deep Range', rating: 98, type: 'legend' },
        { name: 'Wilt Chamberlain', team: 'Philadelphia Warriors', pos: 'C', shot: 82, speed: 78, defense: 86, power: 99, signature: 'Power Finish', rating: 97, type: 'legend' }
      ];

      const activePlayers = [
        { name: 'Luka Doncic', team: 'Mavericks', pos: 'PG', shot: 96, speed: 90, defense: 68, power: 74, signature: 'Stepback', rating: 96, type: 'active' },
        { name: 'Jayson Tatum', team: 'Celtics', pos: 'F', shot: 94, speed: 86, defense: 80, power: 82, signature: 'Pull-Up', rating: 94, type: 'active' },
        { name: 'Giannis Antetokounmpo', team: 'Bucks', pos: 'F', shot: 81, speed: 93, defense: 82, power: 99, signature: 'Transition Finish', rating: 95, type: 'active' },
        { name: 'Shai Gilgeous-Alexander', team: 'Thunder', pos: 'G', shot: 91, speed: 89, defense: 77, power: 80, signature: 'Mid-Range', rating: 93, type: 'active' },
        { name: 'Victor Wembanyama', team: 'Spurs', pos: 'C', shot: 85, speed: 81, defense: 91, power: 97, signature: 'Sky Finish', rating: 95, type: 'active' },
        { name: 'Ja Morant', team: 'Grizzlies', pos: 'G', shot: 87, speed: 96, defense: 60, power: 74, signature: 'Floater Burst', rating: 91, type: 'active' },
        { name: 'Anthony Edwards', team: 'Timberwolves', pos: 'G', shot: 88, speed: 92, defense: 72, power: 84, signature: 'Explosive Drive', rating: 92, type: 'active' },
        { name: 'Nikola Jokic', team: 'Nuggets', pos: 'C', shot: 90, speed: 79, defense: 78, power: 87, signature: 'Playmaker Hook', rating: 96, type: 'active' },
        { name: 'Jalen Brunson', team: 'Knicks', pos: 'PG', shot: 90, speed: 87, defense: 78, power: 72, signature: 'Clutch Shot', rating: 91, type: 'active' },
        { name: 'Tyrese Maxey', team: '76ers', pos: 'G', shot: 89, speed: 92, defense: 72, power: 74, signature: 'Speed Drive', rating: 90, type: 'active' }
      ];

      const allPlayers = [...legends, ...activePlayers];
      let selectedPlayer = allPlayers[0];
      let currentScore = 0;
      let cpuScore = 0;
      let timer = 90;
      let shotMeter = 0;
      let matchRunning = false;
      let shotWindow = null;
      let shotZone = { min: 0.38, max: 0.62 };
      let possession = 'you';
      let combo = 1;
      let money = 250;
      let rank = 'Rookie';
      let lastAction = 'Ready';

      const gameCanvas = document.getElementById('gameCanvas');
      const ctx = gameCanvas.getContext('2d');
      const legendsList = document.getElementById('legendsList');
      const activeList = document.getElementById('activeList');

      const playerNameEl = document.getElementById('playerName');
      const shotStatEl = document.getElementById('shotStat');
      const speedStatEl = document.getElementById('speedStat');
      const defenseStatEl = document.getElementById('defenseStat');
      const powerStatEl = document.getElementById('powerStat');
      const shotMeterEl = document.getElementById('shotMeter');
      const playerScoreEl = document.getElementById('playerScore');
      const cpuScoreEl = document.getElementById('cpuScore');
      const clockEl = document.getElementById('clock');
      const teamScoreTextEl = document.getElementById('teamScoreText');
      const cpuScoreTextEl = document.getElementById('cpuScoreText');
      const possessionBadgeEl = document.getElementById('possessionBadge');
      const shotClockBadgeEl = document.getElementById('shotClockBadge');
      const rankBadgeEl = document.getElementById('rankBadge');

      const keys = { left: false, right: false, jump: false, shoot: false };
      const user = { x: 180, y: 330, vx: 0, vy: 0, width: 34, height: 52, jumpForce: 18, onGround: true, facing: 1, dribble: 0, stamina: 100 };
      const cpu = { x: 680, y: 330, vx: 0, vy: 0, width: 34, height: 52, onGround: true, facing: -1, ai: 0, stamina: 100 };
      const ball = { x: 220, y: 300, vx: 0, vy: 0, active: false, possessor: 'user' };

      function renderRoster() {
        legendsList.innerHTML = '';
        activeList.innerHTML = '';

        const makeCard = (player, parent) => {
          const card = document.createElement('div');
          card.className = 'player-card' + (selectedPlayer.name === player.name ? ' active' : '');
          card.innerHTML = `
            <div class="avatar">${player.name.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase()}</div>
            <div class="name-box">
              <strong>${player.name}</strong>
              <small>${player.team} • ${player.pos}</small>
            </div>
            <div class="rating">${player.rating}</div>
          `;
          card.addEventListener('click', () => {
            selectedPlayer = player;
            renderRoster();
            updateSelectedPlayerUI();
          });
          parent.appendChild(card);
        };

        legends.forEach(p => makeCard(p, legendsList));
        activePlayers.forEach(p => makeCard(p, activeList));
      }

      function updateSelectedPlayerUI() {
        playerNameEl.textContent = selectedPlayer.name;
        shotStatEl.textContent = selectedPlayer.shot;
        speedStatEl.textContent = selectedPlayer.speed;
        defenseStatEl.textContent = selectedPlayer.defense;
        powerStatEl.textContent = selectedPlayer.power;

        const total = selectedPlayer.shot + selectedPlayer.speed + selectedPlayer.defense + selectedPlayer.power;
        if (total >= 350) rank = 'Mythic';
        else if (total >= 320) rank = 'Elite';
        else if (total >= 295) rank = 'Star';
        else rank = 'Rookie';
        rankBadgeEl.textContent = `Rank: ${rank}`;
      }

      function startMatch() {
        matchRunning = true;
        currentScore = 0;
        cpuScore = 0;
        timer = 90;
        combo = 1;
        possession = 'you';
        lastAction = 'Game started';
        updateScoreUI();
        ball.possessor = 'user';
        user.x = 180;
        user.y = 330;
        cpu.x = 680;
      }

      function updateScoreUI() {
        playerScoreEl.textContent = currentScore;
        cpuScoreEl.textContent = cpuScore;
        clockEl.textContent = timer;
        teamScoreTextEl.textContent = currentScore;
        cpuScoreTextEl.textContent = cpuScore;
        possessionBadgeEl.textContent = `Possession: ${possession === 'you' ? 'You' : 'CPU'}`;
        shotClockBadgeEl.textContent = `Shot Clock: ${Math.max(0, 24 - Math.floor((timer % 24)))}`;
        rankBadgeEl.textContent = `Rank: ${rank}`;
      }

      function updateMeter() {
        shotMeterEl.style.width = `${Math.min(100, Math.max(0, shotMeter))}%`;
      }

      function triggerShot() {
        if (!matchRunning) return;
        if (ball.possessor !== 'user') return;

        shotMeter = 0;
        updateMeter();
        const windowTarget = 0.52;
        const playerSkill = selectedPlayer.shot / 100;
        const timing = Math.random();
        const made = timing >= (1 - (0.45 + playerSkill * 0.45));

        if (made && Math.abs(timing - windowTarget) < 0.18) {
          currentScore += 3;
          combo *= 2;
          lastAction = `${selectedPlayer.signature} went in!`;
        } else if (made) {
          currentScore += 2;
          combo += 1;
          lastAction = 'Good bucket';
        } else {
          combo = 1;
          lastAction = 'Missed shot';
        }

        updateScoreUI();
        ball.possessor = 'none';
        setTimeout(() => { ball.possessor = 'cpu'; possession = 'cpu'; }, 250);
      }

      function passBall() {
        if (!matchRunning) return;
        if (ball.possessor !== 'user') return;
        lastAction = `${selectedPlayer.name} dumped the ball`;
        ball.possessor = 'cpu';
        possession = 'cpu';
      }

      function dribbleMove() {
        if (!matchRunning) return;
        if (ball.possessor !== 'user') return;
        const move = selectedPlayer.signature;
        lastAction = `${move} dribble move`;
      }

      function defendMove() {
        if (!matchRunning) return;
        lastAction = 'Lockdown defense';
      }

      function specialMove() {
        if (!matchRunning) return;
        if (ball.possessor !== 'user') return;

        const move = selectedPlayer.signature;
        if (selectedPlayer.name.includes('Kareem')) {
          currentScore += 3;
          lastAction = 'Kareem sky hook!';
        } else if (selectedPlayer.name.includes('Curry')) {
          currentScore += 3;
          lastAction = 'Stephen Curry deep three';
        } else if (selectedPlayer.name.includes('Jordan')) {
          currentScore += 3;
          lastAction = 'Jordan fadeaway';
        } else if (selectedPlayer.name.includes('Giannis')) {
          currentScore += 3;
          lastAction = 'Giannis transition slam';
        } else {
          currentScore += 2;
          lastAction = `${move} signature finish`;
        }

        updateScoreUI();
      }

      function handleInput() {
        if (keys.left) user.x -= 4;
        if (keys.right) user.x += 4;
        if (keys.jump && user.onGround) {
          user.vy = -17;
          user.onGround = false;
        }
      }

      function updatePhysics() {
        user.vy += 0.7;
        user.x += user.vx;
        user.y += user.vy;

        if (user.y + user.height >= 420) {
          user.y = 420 - user.height;
          user.vy = 0;
          user.onGround = true;
        }

        cpu.x += (user.x > cpu.x ? 1.5 : -1.5) * 0.6;
        cpu.x = Math.max(500, Math.min(820, cpu.x));

        if (ball.possessor === 'user') {
          ball.x = user.x + 10;
          ball.y = user.y - 4;
        } else if (ball.possessor === 'cpu') {
          ball.x = cpu.x + 8;
          ball.y = cpu.y - 4;
        } else {
          ball.x += ball.vx;
          ball.y += ball.vy;
          ball.vy += 0.18;
        }

        if (ball.y > 440 && ball.possessor === 'none') {
          ball.vy *= -0.4;
          ball.vx *= 0.82;
        }
      }

      function drawCourt() {
        ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

        // background
        ctx.fillStyle = '#0f6b47';
        ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

        // half-court
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(gameCanvas.width / 2, 0);
        ctx.lineTo(gameCanvas.width / 2, gameCanvas.height);
        ctx.stroke();

        // key/
        ctx.strokeRect(60, 150, 180, 220);
        ctx.strokeRect(660, 150, 180, 220);
        ctx.beginPath();
        ctx.arc(gameCanvas.width / 2, 260, 80, 0, Math.PI * 2);
        ctx.stroke();

        // lane lines
        ctx.beginPath();
        ctx.arc(210, 260, 20, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(690, 260, 20, 0, Math.PI * 2);
        ctx.stroke();

        // rim + backboard
        ctx.fillStyle = '#fff';
        ctx.fillRect(740, 110, 30, 60);
        ctx.fillRect(767, 110, 4, 60);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(770, 118);
        ctx.lineTo(820, 118);
        ctx.stroke();

        ctx.strokeStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(120, 120);
        ctx.lineTo(150, 120);
        ctx.stroke();

        // draw players
        drawPlayer(user, '#4cc9f0', true);
        drawPlayer(cpu, '#ef476f', false);

        // ball
        ctx.beginPath();
        ctx.fillStyle = '#f9c74f';
        ctx.arc(ball.x, ball.y, 10, 0, Math.PI * 2);
        ctx.fill();

        // shot meter overlay on court for user only
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(20, 20, 220, 18);
        ctx.fillStyle = '#90be6d';
        ctx.fillRect(20, 20, 220 * (shotMeter / 100), 18);
      }

      function drawPlayer(player, color, isUser) {
        ctx.fillStyle = color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = '#fff';
        ctx.fillRect(player.x + 6, player.y - 18, 22, 16);
        ctx.fillStyle = '#000';
        ctx.fillRect(player.x + 8, player.y + 14, 8, 18);
        ctx.fillRect(player.x + 18, player.y + 14, 8, 18);
      }

      function animate() {
        handleInput();
        updatePhysics();
        drawCourt();
        requestAnimationFrame(animate);
      }

      function tickClock() {
        setInterval(() => {
          if (matchRunning) {
            timer -= 1;
            if (timer <= 0) {
              timer = 0;
              matchRunning = false;
            }
            updateScoreUI();
          }
        }, 1000);
      }

      function addShotMeter() {
        setInterval(() => {
          if (matchRunning) {
            shotMeter = Math.min(100, shotMeter + 6);
            updateMeter();
          }
        }, 100);
      }

      document.getElementById('shootBtn').addEventListener('click', triggerShot);
      document.getElementById('passBtn').addEventListener('click', passBall);
      document.getElementById('dribbleBtn').addEventListener('click', dribbleMove);
      document.getElementById('defendBtn').addEventListener('click', defendMove);
      document.getElementById('specialBtn').addEventListener('click', specialMove);
      document.getElementById('startBtn').addEventListener('click', startMatch);
      document.getElementById('upgradeBtn').addEventListener('click', () => {
        money -= 25;
        selectedPlayer.shot = Math.min(99, selectedPlayer.shot + 1);
        selectedPlayer.speed = Math.min(99, selectedPlayer.speed + 1);
        selectedPlayer.defense = Math.min(99, selectedPlayer.defense + 1);
        selectedPlayer.power = Math.min(99, selectedPlayer.power + 1);
        updateSelectedPlayerUI();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'w' || e.key === 'ArrowUp') keys.jump = true;
        if (e.code === 'Space') triggerShot();
        if (e.key === 'p') passBall();
        if (e.key === 'f') defendMove();
        if (e.key === 'e') specialMove();
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'a' || e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'd' || e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'w' || e.key === 'ArrowUp') keys.jump = false;
      });

      renderRoster();
      updateSelectedPlayerUI();
      updateScoreUI();
      updateMeter();
      animate();
      tickClock();
      addShotMeter();
    </script>
  </body>
</html>
