<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasketBros Pro</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #07151d, #102a3c 48%, #091823 100%);
        color: #edf6ff;
        font-family: Arial, sans-serif;
      }

      .game-wrap {
        position: relative;
        width: min(96vw, 980px);
        margin: 16px auto;
      }

      .hud {
        position: absolute;
        top: 12px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        pointer-events: none;
      }

      .badge {
        background: rgba(7, 19, 26, 0.78);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 999px;
        padding: 8px 14px;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.12);
        background: linear-gradient(180deg, #0a1a24, #132f46 55%, #091520);
        box-shadow: 0 30px 60px rgba(0,0,0,0.32);
      }
    </style>
  </head>
  <body>
    <div class="game-wrap">
      <div class="hud">
        <div class="badge" id="scoreText">You 0 - 0 CPU</div>
        <div class="badge" id="timeText">60.0</div>
        <div class="badge" id="statusText">Drive to the rim</div>
      </div>
      <canvas id="game" width="980" height="620"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const state = {
        playerScore: 0,
        cpuScore: 0,
        timeLeft: 60,
        lastTime: 0,
        keys: { left: false, right: false, up: false, down: false, shoot: false },
        gameOver: false
      };

      const player = {
        x: 175,
        y: 470,
        w: 28,
        h: 52,
        speed: 290,
        hasBall: true,
        facing: 1,
        vy: 0,
        grounded: true,
        shootCooldown: 0
      };

      const cpu = {
        x: 720,
        y: 470,
        w: 28,
        h: 52,
        speed: 240,
        hasBall: false,
        facing: -1,
        vy: 0,
        grounded: true,
        shootCooldown: 0,
        aiTimer: 0
      };

      const hoop = { x: 820, y: 150 };
      const ball = {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        r: 10,
        carrier: 'player',
        inAir: false,
        shotFromLeft: true
      };

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function resetPositions() {
        player.x = 175;
        player.y = 470;
        player.hasBall = true;
        player.facing = 1;
        player.vy = 0;
        player.grounded = true;
        player.shootCooldown = 0;

        cpu.x = 720;
        cpu.y = 470;
        cpu.hasBall = false;
        cpu.facing = -1;
        cpu.vy = 0;
        cpu.grounded = true;
        cpu.shootCooldown = 0;

        ball.x = player.x + 12;
        ball.y = player.y - 18;
        ball.vx = 0;
        ball.vy = 0;
        ball.inAir = false;
        ball.carrier = 'player';
        ball.shotFromLeft = true;
      }

      function shootForPlayer() {
        if (!player.hasBall || ball.inAir || state.gameOver) return;

        const targetX = hoop.x + (Math.random() * 28 - 14);
        const targetY = hoop.y + 18;
        const dx = targetX - (player.x + 10);
        const dy = targetY - (player.y - 16);

        ball.inAir = true;
        ball.carrier = 'air';
        ball.shotFromLeft = player.x < canvas.width / 2;
        ball.vx = dx * 0.12;
        ball.vy = -Math.abs(dy) * 0.14 - 10.2;
        player.hasBall = false;
        state.keys.shoot = false;
      }

      function shootForCPU() {
        if (!cpu.hasBall || ball.inAir || state.gameOver) return;

        const targetX = 180 + Math.random() * 30;
        const dx = targetX - cpu.x;
        const dy = hoop.y - (cpu.y - 18);

        ball.inAir = true;
        ball.carrier = 'air';
        ball.shotFromLeft = false;
        ball.vx = dx * 0.12;
        ball.vy = -Math.abs(dy) * 0.14 - 10.1;
        cpu.hasBall = false;
      }

      function updatePlayer(dt) {
        let moveDir = 0;
        if (state.keys.left) moveDir -= 1;
        if (state.keys.right) moveDir += 1;

        if (moveDir !== 0) {
          player.x += moveDir * player.speed * dt;
          player.facing = moveDir > 0 ? 1 : -1;
        }

        player.x = clamp(player.x, 110, 360);

        if (state.keys.up && player.grounded) {
          player.vy = -420;
          player.grounded = false;
        }

        player.vy += 980 * dt;
        player.y += player.vy * dt;

        if (player.y >= 470) {
          player.y = 470;
          player.vy = 0;
          player.grounded = true;
        }

        if (player.hasBall) {
          ball.x = player.x + 12;
          ball.y = player.y - 18 + Math.sin(performance.now() * 0.02) * 2.2;
        }

        player.shootCooldown = Math.max(0, player.shootCooldown - dt);

        if (state.keys.shoot && player.shootCooldown === 0) {
          shootForPlayer();
          player.shootCooldown = 0.24;
        }
      }

      function updateCPU(dt) {
        if (ball.inAir) {
          cpu.aiTimer = 0;
          return;
        }

        cpu.aiTimer += dt;

        if (cpu.hasBall) {
          const targetX = 760;
          const targetY = 450;
          cpu.x += (targetX - cpu.x) * 0.8 * dt;
          cpu.y += (targetY - cpu.y) * 0.8 * dt;
          cpu.x = clamp(cpu.x, 590, 860);
          cpu.y = clamp(cpu.y, 410, 560);

          if (cpu.aiTimer > 0.85) {
            shootForCPU();
            cpu.aiTimer = 0;
          }

          ball.x = cpu.x - 10;
          ball.y = cpu.y - 18 + Math.sin(performance.now() * 0.02 + 38) * 2.1;
          return;
        }

        if (!player.hasBall && Math.random() < 0.018) {
          cpu.hasBall = true;
          ball.carrier = 'cpu';
        }

        const targetX = player.x + 100;
        cpu.x += (targetX - cpu.x) * 0.9 * dt;
        cpu.x = clamp(cpu.x, 590, 860);
        cpu.y += (player.y - cpu.y) * 0.6 * dt;
        cpu.y = clamp(cpu.y, 410, 560);

        if (cpu.hasBall) {
          ball.x = cpu.x - 12;
          ball.y = cpu.y - 18 + Math.sin(performance.now() * 0.02 + 40) * 2.1;
        }
      }

      function updateBall(dt) {
        if (!ball.inAir) return;

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.vy += 880 * dt;

        const rimLeft = hoop.x - 34;
        const rimRight = hoop.x + 34;
        const rimTop = hoop.y - 12;
        const rimBottom = hoop.y + 18;

        if (ball.x > rimLeft && ball.x < rimRight && ball.y > rimTop && ball.y < rimBottom && ball.vy > 0) {
          const centerHit = ball.x > hoop.x - 12 && ball.x < hoop.x + 12 && ball.y > hoop.y - 8 && ball.y < hoop.y + 8;
          if (centerHit) {
            if (ball.shotFromLeft) {
              state.playerScore += 2;
              document.getElementById('statusText').textContent = 'Nice bucket!';
            } else {
              state.cpuScore += 2;
              document.getElementById('statusText').textContent = 'CPU scores';
            }

            ball.inAir = false;
            ball.vx = 0;
            ball.vy = 0;
            resetPositions();
            return;
          }
        }

        if (ball.y > 575) {
          ball.inAir = false;
          ball.vx = 0;
          ball.vy = 0;

          if (ball.shotFromLeft) {
            player.hasBall = true;
            ball.carrier = 'player';
            ball.x = player.x + 12;
            ball.y = player.y - 18;
            document.getElementById('statusText').textContent = 'Rebound';
          } else {
            cpu.hasBall = true;
            ball.carrier = 'cpu';
            ball.x = cpu.x - 12;
            ball.y = cpu.y - 18;
            document.getElementById('statusText').textContent = 'CPU rebound';
          }
        }
      }

      function drawCourt() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bg.addColorStop(0, '#0b1e2a');
        bg.addColorStop(1, '#183448');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#1f7b6c';
        ctx.fillRect(0, 520, canvas.width, 100);

        ctx.strokeStyle = 'rgba(255,255,255,0.52)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(80, 80);
        ctx.lineTo(80, 520);
        ctx.lineTo(900, 520);
        ctx.lineTo(900, 80);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(490, 80);
        ctx.lineTo(490, 520);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(490, 132, 82, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(490, 155, 18, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#ffb703';
        ctx.fillRect(785, 118, 18, 58);
        ctx.fillRect(770, 143, 48, 10);

        ctx.fillStyle = '#edf6ff';
        ctx.fillRect(825, 138, 44, 10);

        ctx.fillStyle = '#0c2636';
        for (let i = 0; i < 12; i++) {
          const x = 50 + i * 62;
          const h = 44 + (i % 4) * 30;
          ctx.fillRect(x, 520 - h, 42, h);
        }
      }

      function drawPlayer(entity, color) {
        const bodyX = entity.x - entity.w / 2;
        const bodyY = entity.y - entity.h / 2;

        ctx.fillStyle = color;
        ctx.fillRect(bodyX, bodyY, entity.w, entity.h);

        ctx.fillStyle = '#edf6ff';
        ctx.beginPath();
        ctx.arc(bodyX + entity.w / 2, bodyY - 12, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#edf6ff';
        ctx.fillRect(bodyX + 8, bodyY + entity.h - 4, 6, 18);
        ctx.fillRect(bodyX + entity.w - 14, bodyY + entity.h - 4, 6, 18);
      }

      function drawBall() {
        if (ball.carrier === 'player') {
          ball.x = player.x + 12;
          ball.y = player.y - 18;
        }
        if (ball.carrier === 'cpu') {
          ball.x = cpu.x - 10;
          ball.y = cpu.y - 18;
        }

        ctx.fillStyle = '#f5d04f';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ca9a13';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      function drawUI() {
        ctx.fillStyle = '#edf6ff';
        ctx.font = 'bold 24px Arial';
        ctx.fillText(`You ${state.playerScore} - ${state.cpuScore} CPU`, 40, 40);
        ctx.fillText(`${state.timeLeft.toFixed(1)}s`, 840, 40);
      }

      function render() {
        drawCourt();
        drawPlayer(player, '#4cc9f0');
        drawPlayer(cpu, '#ef476f');
        drawBall();
        drawUI();
      }

      function tick(timestamp) {
        if (!state.lastTime) state.lastTime = timestamp;
        const dt = Math.min((timestamp - state.lastTime) / 1000, 0.032);
        state.lastTime = timestamp;

        if (!state.gameOver) {
          state.timeLeft -= dt;
          if (state.timeLeft <= 0) {
            state.timeLeft = 0;
            state.gameOver = true;
            document.getElementById('statusText').textContent = state.playerScore > state.cpuScore ? 'Victory!' : 'Game over';
          }
        }

        if (!state.gameOver) {
          updatePlayer(dt);
          updateCPU(dt);
          updateBall(dt);
        }

        render();
        document.getElementById('scoreText').textContent = `You ${state.playerScore} - ${state.cpuScore} CPU`;
        document.getElementById('timeText').textContent = `${state.timeLeft.toFixed(1)}`;

        requestAnimationFrame(tick);
      }

      window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'a' || event.key === 'ArrowLeft') state.keys.left = true;
        if (key === 'd' || event.key === 'ArrowRight') state.keys.right = true;
        if (key === 'w' || event.key === 'ArrowUp') state.keys.up = true;
        if (key === 's' || event.key === 'ArrowDown') state.keys.down = true;
        if (key === ' ' || key === 'f') state.keys.shoot = true;
      });

      window.addEventListener('keyup', (event) => {
        const key = event.key.toLowerCase();
        if (key === 'a' || event.key === 'ArrowLeft') state.keys.left = false;
        if (key === 'd' || event.key === 'ArrowRight') state.keys.right = false;
        if (key === 'w' || event.key === 'ArrowUp') state.keys.up = false;
        if (key === 's' || event.key === 'ArrowDown') state.keys.down = false;
      });

      resetPositions();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
