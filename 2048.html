<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0a1520; color:white; font-family:Arial,sans-serif; }
      .game { width: 350px; padding: 20px; background:#1b2d40; border-radius: 20px; }
      .grid { display:grid; grid-template-columns: repeat(4, 70px); gap: 10px; margin-top: 12px; }
      .cell { width:70px; height:70px; border-radius: 12px; background: rgba(255,255,255,0.08); display:grid; place-items:center; font-size: 1.7rem; font-weight:700; }
      .score { font-size: 1.1rem; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="score" id="score">Score: 0</div>
      <div class="grid" id="grid"></div>
    </div>
    <script>
      let board = Array.from({ length: 4 }, () => Array(4).fill(0));
      let score = 0;
      function addRandom() {
        const empties = [];
        for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!board[r][c]) empties.push([r, c]);
        if (!empties.length) return;
        const [r, c] = empties[Math.floor(Math.random() * empties.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }
      function render() {
        const cells = document.getElementById('grid');
        cells.innerHTML = '';
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            const div = document.createElement('div');
            div.className = 'cell';
            div.textContent = board[r][c] || '';
            cells.appendChild(div);
          }
        }
        document.getElementById('score').textContent = `Score: ${score}`;
      }
      function move(dir) {
        let newBoard = board.map(row => [...row]);
        const merged = Array.from({ length: 4 }, () => Array(4).fill(false));
        if (dir === 'left' || dir === 'right') {
          for (let r = 0; r < 4; r++) {
            let row = board[r].filter(Boolean);
            if (dir === 'right') row.reverse();
            for (let i = 0; i < row.length - 1; i++) {
              if (row[i] === row[i+1]) { row[i] *= 2; score += row[i]; row.splice(i+1,1); merged[r][i] = true; }
            }
            if (dir === 'right') row.reverse();
            newBoard[r] = Array(4).fill(0);
            for (let c = 0; c < row.length; c++) newBoard[r][dir === 'right' ? 3 - c : c] = row[c];
          }
        }
        if (dir === 'up' || dir === 'down') {
          for (let c = 0; c < 4; c++) {
            let col = [];
            for (let r = 0; r < 4; r++) if (board[r][c]) col.push(board[r][c]);
            if (dir === 'down') col.reverse();
            for (let i = 0; i < col.length - 1; i++) {
              if (col[i] === col[i + 1]) { col[i] *= 2; score += col[i]; col.splice(i+1,1); }
            }
            if (dir === 'down') col.reverse();
            let idx = 0;
            for (let r = 0; r < 4; r++) {
              newBoard[r][c] = 0;
            }
            for (let r = dir === 'down' ? 3 : 0; dir === 'down' ? r >= 0 : r < 4; dir === 'down' ? r-- : r++) {
              if (idx < col.length) {
                newBoard[r][c] = col[idx];
                idx++;
              }
            }
          }
        }
        board = newBoard;
        addRandom();
        render();
      }
      addRandom(); addRandom(); render();
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') move('left');
        if (e.key === 'ArrowRight') move('right');
        if (e.key === 'ArrowUp') move('up');
        if (e.key === 'ArrowDown') move('down');
      });
    </script>
  </body>
</html>
